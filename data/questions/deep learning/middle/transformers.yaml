    expected_points:
      - "Embed chunks into vectors; store in a vector DB"
      - "Query: embed question, find nearest neighbors (cosine similarity)"
      - "ANN indexes: HNSW, IVF, product quantization for speed at scale"
      - "Chunking strategy (size, overlap) critically affects retrieval"
      - "Hybrid retrieval (BM25 + dense) improves recall"

  - id: "dlm-tr-020"
    type: "knowledge"
    difficulty: 4
    tags: ["rag", "evaluation", "hallucination"]
    question:
      text:
        en: "How do you evaluate a RAG system and reduce hallucinations?"
        ru: "Как оценивать RAG-систему и уменьшать галлюцинации?"
      code: null
    follow_ups:
      en:
        - "What is the difference between faithfulness and answer relevance?"
      ru:
        - "Чем faithfulness отличается от answer relevance?"
    expected_points:
      - "Evaluate retrieval (recall@k, MRR) separately from generation"
      - "Faithfulness: does the answer follow the retrieved context"
      - "Answer relevance: does it address the question"
      - "Reduce hallucination: ground generation, cite sources, penalize unsupported claims"
      - "Fallback behavior when retrieval is low-confidence"

  - id: "dlm-tr-021"
    type: "knowledge"
    difficulty: 4
    tags: ["fine-tuning", "llm"]
    question:
      text:
        en: "When should you fine-tune an LLM versus using RAG or prompting?"
        ru: "Когда следует fine-tune LLM, а когда использовать RAG или prompting?"
      code: null
    follow_ups:
      en:
        - "What is the cost of fine-tuning a large model?"
      ru:
        - "Какова стоимость fine-tuning большой модели?"
    expected_points:
      - "Prompting/RAG: no retraining, flexible knowledge, fast"
      - "Fine-tuning: bake in format/style/task behavior, better on narrow tasks"
      - "RAG for up-to-date/factual knowledge; fine-tune for behavior/format"
      - "Fine-tuning cost: data, compute, evaluation, maintenance"
      - "Often combine: fine-tuned base + RAG for knowledge"

  - id: "dlm-tr-022"
    type: "knowledge"
    difficulty: 5
    tags: ["lora", "peft", "fine-tuning"]
    question:
      text:
        en: "What is LoRA (Low-Rank Adaptation) and how does it enable efficient fine-tuning of large models?"
        ru: "Что такое LoRA (Low-Rank Adaptation) и как он позволяет эффективно fine-tune большие модели?"
      code: null
    follow_ups:
      en:
        - "What is the rank in LoRA and how do you choose it?"
      ru:
        - "Каков rank в LoRA и как его выбирают?"
    expected_points:
      - "Freeze base weights; learn low-rank delta: W' = W + BA (B: d x r, A: r x d)"
      - "Only r << d parameters trained per matrix -> tiny memory/compute"
      - "Applied to attention (and sometimes FFN) projections"
      - "Multiple task adapters can be swapped at inference"
      - "Rank and target modules are hyperparameters; higher rank = more capacity"

  - id: "dlm-tr-023"
    type: "knowledge"
    difficulty: 5
    tags: ["qlora", "quantization", "fine-tuning"]
    question:
      text:
        en: "What is QLoRA and how does it combine quantization with LoRA?"
        ru: "Что такое QLoRA и как он сочетает квантование с LoRA?"
      code: null
    follow_ups:
      en:
        - "Why is a 4-bit base model fine-tunable without major accuracy loss?"
      ru:
        - "Почему 4-bit базовая модель fine-tune-ится без большой потери точности?"
    expected_points:
      - "QLoRA: quantize base to 4-bit (NF4), train LoRA adapters in higher precision"
      - "Dequantize on the fly for the forward pass; gradients only for adapters"
      - "Double quantization + paged optimizers to fit in one GPU"
      - "Fine-tune 65B model on a single 48GB GPU"
      - "Near full fine-tuning quality with far less memory"

  - id: "dlm-tr-024"
