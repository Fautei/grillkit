        - "What are the main components of a RAG pipeline?"
      ru:
        - "Каковы основные компоненты RAG-пайплайна?"
    expected_points:
      - "RAG: retrieve relevant documents, feed as context to generate grounded answers"
      - "Pipeline: index corpus (embeddings), retrieve top-k, augment prompt, generate"
      - "Reduces hallucination, enables up-to-date/knowledge-base Q&A"
      - "Components: chunking, embeddings, vector DB, retriever, generator"
      - "Quality depends on retrieval precision and chunking"

  - id: "dlm-tr-019"
