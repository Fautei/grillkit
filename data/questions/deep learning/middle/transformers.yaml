category: "Transformers"
track: "deep learning"
level: "middle"

description: "Transformer architecture, BERT/GPT families, and modern NLP with transformers"

questions:
  - id: "dlm-tr-001"
    type: "knowledge"
    difficulty: 3
    tags: ["transformer", "architecture", "attention"]
    question:
      text:
        en: "Describe the overall Transformer architecture: encoder, decoder, and their components."
        ru: "Опишите общую архитектуру Transformer: encoder, decoder и их компоненты."
      code: null
    follow_ups:
      en:
        - "What are the two sub-layers inside each encoder block?"
      ru:
        - "Какие два под-слоя внутри каждого encoder-блока?"
    expected_points:
      - "Encoder: stacked blocks of self-attention + feed-forward"
      - "Decoder: masked self-attention + cross-attention + feed-forward"
      - "Multi-head self-attention captures token interactions"
      - "Positional encodings add sequence order"
      - "LayerNorm + residual connections around each sub-layer"

  - id: "dlm-tr-002"
    type: "knowledge"
    difficulty: 3
    tags: ["attention", "qkv"]
    question:
      text:
        en: "Explain the scaled dot-product attention: what are Q, K, V and why scale by sqrt(d_k)?"
        ru: "Объясните scaled dot-product attention: что такое Q, K, V и зачем масштабировать на sqrt(d_k)?"
      code: null
    follow_ups:
      en:
        - "What happens to attention softmax when scores are very large?"
      ru:
        - "Что происходит с softmax attention, когда очки очень большие?"
    expected_points:
      - "Q (query), K (key), V (value): projections of the input"
      - "Attention = softmax(QK^T / sqrt(d_k)) V"
      - "Dot product measures query-key similarity; values are what gets mixed"
      - "Scaling by sqrt(d_k): prevents large dot products saturating softmax"
      - "Large scores -> softmax peaks -> vanishing gradients"

  - id: "dlm-tr-003"
    type: "knowledge"
    difficulty: 3
    tags: ["multi-head", "attention"]
    question:
      text:
        en: "What is multi-head attention and why use multiple heads instead of one large head?"
        ru: "Что такое multi-head attention и зачем несколько голов вместо одной большой?"
      code: null
    follow_ups:
      en:
        - "How is the dimension split across heads?"
      ru:
        - "Как размерность делится между головами?"
    expected_points:
      - "Run h independent attention functions in parallel subspaces"
      - "Each head learns different relationship types (syntax, coreference, etc.)"
      - "d_model split: d_k = d_v = d_model/h"
      - "Concatenate head outputs + linear projection"
      - "More expressive than a single attention over the full space"

  - id: "dlm-tr-004"
    type: "knowledge"
    difficulty: 4
    tags: ["transformer", "ffn", "mlp"]
    question:
      text:
        en: "What is the role of the feed-forward (FFN) sub-layer in each transformer block?"
        ru: "Какова роль feed-forward (FFN) под-слоя в каждом блоке трансформера?"
      code: null
    follow_ups:
      en:
        - "Why is the FFN expansion ratio usually 4x (or 8/3x with SwiGLU)?"
      ru:
        - "Почему расширение FFN обычно 4x (или 8/3x с SwiGLU)?"
    expected_points:
      - "Position-wise: two linear layers with nonlinearity, applied per token"
      - "Adds nonlinearity and capacity (mixing information across channels)"
      - "Attention mixes across positions; FFN mixes across features"
      - "Expansion: project up (4x), nonlinearity, project back"
      - "Holds the majority of transformer parameters (especially in LLMs)"

  - id: "dlm-tr-005"
    type: "knowledge"
    difficulty: 4
    tags: ["transformer", "layernorm", "pre-post"]
    question:
      text:
        en: "What is the difference between pre-norm and post-norm transformers? Which is used in modern LLMs and why?"
        ru: "В чём разница между pre-norm и post-norm трансформерами? Какой используют современные LLM и почему?"
      code: null
    follow_ups:
      en:
        - "What is the gradient problem in deep post-norm networks?"
      ru:
        - "Какова проблема градиентов в глубоких post-norm сетях?"
    expected_points:
      - "Post-norm: LayerNorm after the sub-layer (original Transformer)"
      - "Pre-norm: LayerNorm before the sub-layer (residual is cleaner)"
      - "Pre-norm: more stable gradients, trains easier at depth"
      - "Post-norm can be slightly better final quality with careful warmup"
      - "Modern LLMs (GPT, LLaMA) use pre-norm (or RMSNorm pre-norm)"

  - id: "dlm-tr-006"
    type: "knowledge"
    difficulty: 4
    tags: ["rmsnorm", "layernorm"]
    question:
      text:
        en: "What is RMSNorm and how does it simplify LayerNorm?"
        ru: "Что такое RMSNorm и как он упрощает LayerNorm?"
      code: null
    follow_ups:
      en:
        - "Why is the mean subtraction dropped?"
      ru:
        - "Почему отбрасывают вычитание среднего?"
    expected_points:
      - "RMSNorm: scale by root mean square of activations, no mean centering"
      - "x / RMS(x) * gamma; RMS = sqrt(mean(x^2))"
      - "Cheaper (no mean computation), similar performance"
      - "Used in LLaMA and many modern architectures"
      - "Empirically mean subtraction contributes little"

  - id: "dlm-tr-007"
    type: "knowledge"
    difficulty: 3
    tags: ["bert", "encoder", "mlm"]
    question:
      text:
        en: "How does BERT work? Explain its architecture and the masked language model (MLM) objective."
        ru: "Как работает BERT? Объясните архитектуру и objective masked language model (MLM)."
      code: null
    follow_ups:
      en:
        - "Why is MLM bidirectional and good for understanding tasks?"
      ru:
        - "Почему MLM bidirectional и хорош для understanding-задач?"
    expected_points:
      - "BERT: encoder-only transformer (stack of bidirectional self-attention)"
      - "Pretrain: MLM (predict masked tokens) + NSP (next sentence prediction)"
      - "Bidirectional: uses left and right context -> rich representations"
      - "Fine-tune for classification, NER, QA, etc."
      - "Strong for understanding/extraction, not generation"

  - id: "dlm-tr-008"
    type: "knowledge"
    difficulty: 3
    tags: ["gpt", "decoder", "clm"]
    question:
      text:
        en: "How does GPT work? Explain its decoder-only architecture and causal language modeling."
        ru: "Как работает GPT? Объясните decoder-only архитектуру и causal language modeling."
      code: null
    follow_ups:
      en:
        - "How does the causal mask work in GPT's attention?"
      ru:
        - "Как работает causal mask во внимании GPT?"
    expected_points:
      - "GPT: decoder-only transformer with causal (masked) self-attention"
      - "Pretrain: predict next token (causal LM), autoregressive"
      - "Causal mask: each token attends only to previous tokens"
      - "Single objective, scales extremely well with size/data"
      - "Generates text autoregressively; strong few-shot in-context learning"

  - id: "dlm-tr-009"
    type: "knowledge"
    difficulty: 4
    tags: ["t5", "enc-dec", "seq2seq"]
    question:
      text:
        en: "How does T5 (encoder-decoder) differ from BERT and GPT, and what is its text-to-text framework?"
        ru: "Чем T5 (encoder-decoder) отличается от BERT и GPT и какова его text-to-text парадигма?"
      code: null
    follow_ups:
      en:
        - "Why does T5 use the same tokenizer and objective for all tasks?"
      ru:
        - "Почему T5 использует один токенайзер и objective для всех задач?"
    expected_points:
      - "T5: encoder-decoder; encoder reads input, decoder generates output"
      - "All tasks as text-to-text: prefix the input with task instruction"
      - "Pretrain: span corruption (replace spans with [MASK], predict them)"
      - "Flexible for translation, summarization, QA in one model"
      - "Relative positional biases (bias by distance) instead of absolute"

  - id: "dlm-tr-010"
    type: "knowledge"
    difficulty: 4
    tags: ["transformer", "scaling", "parameters"]
    question:
      text:
        en: "How do you estimate the parameter count of a transformer from its dimensions?"
        ru: "Как оценить количество параметров трансформера по его размерностям?"
      code: null
    follow_ups:
      en:
        - "Where do most parameters live (attention vs FFN vs embeddings)?"
      ru:
        - "Где живёт большинство параметров (attention vs FFN vs эмбеддинги)?"
    expected_points:
      - "Embeddings: vocab_size * d_model (input + output, often tied)"
      - "Per attention head: Q,K,V,O projections ~ 4 * d_model^2; total ~ 4 d_model^2"
      - "FFN: 2 * d_model * d_ff (typically d_ff = 4*d_model -> 8 d_model^2)"
      - "Per layer ~ 12 d_model^2 (attn + FFN) + LayerNorm params"
      - "Total ~ layers * 12 d_model^2 + 2 * vocab * d_model"

  - id: "dlm-tr-011"
    type: "knowledge"
    difficulty: 4
    tags: ["transformer", "compute", "flops"]
    question:
      text:
        en: "How do you estimate the training FLOPs of a transformer and what does it tell you?"
        ru: "Как оценить тренировочные FLOPs трансформера и что это говорит?"
      code: null
    follow_ups:
      en:
        - "Why is the 6*N*D rule of thumb used?"
      ru:
        - "Почему используется правило 6*N*D?"
    expected_points:
      - "Per token: ~2 FLOPs per parameter for forward, ~4 for backward -> 6*N*D total"
      - "N = params, D = tokens -> total training FLOPs ~ 6 * N * D"
      - "Attention adds a term quadratic in sequence length (often small for LLMs)"
      - "Used to plan compute budgets and compare training runs"
      - "Chinchilla used this to find compute-optimal scaling"

  - id: "dlm-tr-012"
    type: "knowledge"
    difficulty: 4
    tags: ["scaling-laws", "chinchilla"]
    question:
      text:
        en: "What are neural scaling laws and what did the Chinchilla finding show?"
        ru: "Каковы neural scaling laws и что показал finding Chinchilla?"
      code: null
    follow_ups:
      en:
        - "How many tokens should a 70B model see for optimal compute?"
      ru:
        - "Сколько токенов должно увидеть модель 70B для оптимального compute?"
    expected_points:
      - "Loss follows a power law in parameters, data, and compute"
      - "Chinchilla: for fixed compute, scale params and tokens equally"
      - "Optimal: ~20 tokens per parameter (1:20 ratio)"
      - "GPT-3 (175B) was under-trained (~5 tokens/param); Chinchilla 70B at 1:20 beat it"
      - "Implication: smaller models with more data can outperform larger under-trained ones"

  - id: "dlm-tr-013"
    type: "knowledge"
    difficulty: 4
    tags: ["tokenization", "bpe", "vocab"]
    question:
      text:
        en: "How do you choose a vocabulary size and tokenizer for a language model? What are the trade-offs?"
        ru: "Как выбирать размер vocabulary и токенайзер для языковой модели? Каковы компромиссы?"
      code: null
    follow_ups:
      en:
        - "Why do smaller vocabularies increase sequence length?"
      ru:
        - "Почему меньший vocab увеличивает длину последовательности?"
    expected_points:
      - "Vocab size: larger = better compression per token but bigger embedding table"
      - "Smaller vocab: longer sequences (more attention cost), slower generation"
      - "Trade-off: embedding params vs sequence length/compute"
      - "Multilingual: need larger vocab or character-based fallback"
      - "BPE/SentencePiece balance OOV handling and compression"

  - id: "dlm-tr-014"
    type: "knowledge"
    difficulty: 4
    tags: ["tokenizer", "multilingual", "fairness"]
    question:
      text:
        en: "What is tokenizer bias across languages and why does it matter?"
        ru: "Каков bias токенизатора между языками и почему это важно?"
      code: null
    follow_ups:
      en:
        - "How does bytes-per-character affect multilingual performance?"
      ru:
        - "Как bytes-per-character влияет на multilingual качество?"
    expected_points:
      - "Tokenizers trained mostly on English compress English better"
      - "Other languages need more tokens per word/character -> longer sequences"
      - "Unequal tokens-per-word -> less effective context and capacity for low-resource languages"
      - "Affects model quality, cost, and fairness across languages"
      - "Mitigations: multilingual tokenizer, balanced training data"

  - id: "dlm-tr-015"
    type: "knowledge"
    difficulty: 4
    tags: ["prompting", "icl", "few-shot"]
    question:
      text:
        en: "What is in-context learning and few-shot prompting? Why do large LLMs exhibit it?"
        ru: "Что такое in-context learning и few-shot prompting? Почему большие LLM это демонстрируют?"
      code: null
    follow_ups:
