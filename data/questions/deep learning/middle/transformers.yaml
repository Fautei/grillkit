        - "What are the failure modes of few-shot prompting?"
      ru:
        - "Каковы failure modes few-shot prompting?"
    expected_points:
      - "ICL: model adapts to a task from examples in the prompt, no weight updates"
      - "Few-shot: provide k input-output demonstrations in context"
      - "Emerges with scale; related to internal task recognition"
      - "Order/format of examples matters (format consistency, label balance)"
      - "Failure: label bias, order sensitivity, format confusion"

  - id: "dlm-tr-016"
    type: "knowledge"
