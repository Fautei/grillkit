      - "Stage 1: SFT on high-quality demonstrations"
      - "Stage 2: collect human preference rankings, train a reward model"
      - "Stage 3: optimize policy (LLM) against reward model via RL (PPO)"
      - "Reward model approximates human preferences cheaply at scale"

  - id: "dlm-tr-025"
    type: "knowledge"
    difficulty: 5
    tags: ["ppo", "rl", "llm"]
    question:
      text:
        en: "How is PPO used to fine-tune an LLM in RLHF? What are the policy, reward, and value models?"
        ru: "Как PPO используется для fine-tuning LLM в RLHF? Какие у нас policy, reward и value модели?"
      code: null
    follow_ups:
      en:
        - "What is the KL penalty in the RLHF objective?"
      ru:
        - "Каков KL penalty в RLHF objective?"
    expected_points:
      - "Policy = the LLM being trained; generates responses"
      - "Reward model scores responses (from human preferences)"
      - "Value model estimates expected return for advantage computation"
      - "PPO: clipped policy gradient, stable on-policy RL"
      - "KL penalty keeps policy close to SFT reference (prevents reward hacking)"

  - id: "dlm-tr-026"
    type: "knowledge"
    difficulty: 5
    tags: ["reward-model", "preference", "btl"]
    question:
      text:
        en: "How do you train a reward model from human preference data?"
        ru: "Как обучить reward model на human preference data?"
      code: null
    follow_ups:
      en:
        - "What is the Bradley-Terry-Lord model?"
      ru:
        - "Что такое модель Bradley-Terry-Lord?"
    expected_points:
      - "Data: prompt + two responses, human picks the better one"
      - "Reward model = LM backbone with a scalar head (score per response)"
      - "Bradley-Terry: P(y_a > y_b) = sigmoid(r(x,y_a) - r(x,y_b))"
      - "Train with a ranking (margin) loss on the preference pairs"
      - "RM approximates a preference function over responses"

  - id: "dlm-tr-027"
    type: "knowledge"
    difficulty: 5
    tags: ["reward-hacking", "specification", "rl"]
    question:
      text:
        en: "What is reward hacking and how does the KL constraint mitigate it in RLHF?"
        ru: "Что такое reward hacking и как KL-ограничение смягчает его в RLHF?"
      code: null
    follow_ups:
      en:
        - "Give examples of reward hacking in LLMs."
      ru:
        - "Приведите примеры reward hacking у LLM."
    expected_points:
      - "Reward hacking: policy exploits reward model flaws to get high scores"
      - "Examples: verbose answers, sycophancy, format tricks, repetition"
      - "Reward model is an imperfect proxy for true human preference"
      - "KL penalty: max reward - beta * KL(policy || reference)"
      - "KL keeps behavior near the reference SFT model, limiting exploitation"

  - id: "dlm-tr-028"
    type: "knowledge"
    difficulty: 5
    tags: ["dpo", "alignment", "preference"]
    question:
      text:
        en: "What is DPO (Direct Preference Optimization) and how does it simplify RLHF?"
        ru: "Что такое DPO (Direct Preference Optimization) и как он упрощает RLHF?"
      code: null
    follow_ups:
      en:
        - "Why does DPO not need a separate reward model or RL loop?"
      ru:
        - "Почему DPO не требует отдельной reward model или RL-цикла?"
    expected_points:
      - "DPO: directly optimize the policy from preference pairs via a closed-form reformulation"
      - "Derives the optimal policy in terms of the reward; substitutes into a BT loss"
      - "No reward model, no PPO, no sampling/RL loop -> simpler and more stable"
      - "Trains with a supervised-style loss on chosen/rejected pairs"
      - "Competitive with PPO for alignment, much easier to run"

  - id: "dlm-tr-029"
    type: "knowledge"
    difficulty: 4
    tags: ["hallucination", "llm"]
    question:
      text:
