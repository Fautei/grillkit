    expected_points:
      - "CoT: elicit intermediate reasoning steps before the final answer"
      - "Improves multi-step reasoning (math, logic) significantly"
      - "Zero-shot CoT: append 'Let's think step by step'"
      - "Reasoning trace acts as working memory/compute"
      - "Less helpful for simple tasks; can hallucinate flawed reasoning"

  - id: "dlm-tr-018"
    type: "knowledge"
    difficulty: 4
    tags: ["retrieval", "rag"]
    question:
      text:
        en: "What is Retrieval-Augmented Generation (RAG) and how does it work?"
        ru: "Что такое Retrieval-Augmented Generation (RAG) и как он работает?"
      code: null
    follow_ups:
