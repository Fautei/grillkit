      - "Few-shot examples with consistent formatting"
      - "Chain-of-thought: prompt to show reasoning steps before answer"
      - "Delimiters, structured output (JSON), constraints"
      - "Self-consistency: sample multiple CoT paths, majority vote"

  - id: "dlm-tr-017"
    type: "knowledge"
