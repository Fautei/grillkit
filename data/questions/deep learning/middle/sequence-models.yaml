      - "Bidirectional RNN captures context in both directions"
      - "BoW/CNN: no order modeling, but fast and works surprisingly well"
      - "Text CNNs: n-gram filters capture local patterns, parallel"
      - "Choice depends on data size, latency, and need for order"

