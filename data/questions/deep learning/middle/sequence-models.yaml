      - "Training: teacher forcing, cross-entropy over target tokens"
      - "Inference: beam search keeps top-k partial sequences"
      - "Subword tokenization (BPE) handles unknown words"
      - "Attention aligns source and target positions"

  - id: "dlm-seq-014"
