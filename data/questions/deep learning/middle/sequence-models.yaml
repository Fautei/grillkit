        ru: "Сравните greedy decoding, beam search и sampling для генерации последовательностей."
      code: null
    follow_ups:
      en:
        - "How does the beam width trade-off work?"
      ru:
        - "Как работает компромисс ширины beam?"
    expected_points:
      - "Greedy: pick argmax each step; fast but locally optimal, repetitive"
      - "Beam search: keep top-k sequences, globally better within beam"
      - "Sampling: stochastic (top-k/top-p/temperature); diverse but less controlled"
      - "Beam search: larger beam = better but slower and more repetitive"
      - "Task-dependent: translation favors beam, creative text favors sampling"

