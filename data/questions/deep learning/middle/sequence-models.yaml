category: "Sequence Models"
track: "deep learning"
level: "middle"

description: "RNNs, LSTMs, GRUs, seq2seq, attention mechanisms, and sequence tasks"

questions:
  - id: "dlm-seq-001"
    type: "knowledge"
    difficulty: 3
    tags: ["rnn", "recurrent", "hidden-state"]
    question:
      text:
        en: "Explain the vanilla RNN: how the hidden state evolves over time and what weight sharing means."
        ru: "Объясните обычный RNN: как скрытое состояние меняется во времени и что значит разделение весов."
      code: null
    follow_ups:
      en:
        - "What is the recurrence relation of an RNN?"
      ru:
        - "Каково рекуррентное уравнение RNN?"
    expected_points:
      - "h_t = tanh(W_xh * x_t + W_hh * h_{t-1} + b)"
      - "Hidden state carries information across time steps"
      - "Same weights W_xh, W_hh used at every step (weight sharing)"
      - "Output y_t = W_hy * h_t + b (or only at final step)"
      - "Handles variable-length sequences unlike feed-forward nets"

  - id: "dlm-seq-002"
    type: "knowledge"
    difficulty: 3
    tags: ["rnn", "bptt", "vanishing"]
    question:
      text:
        en: "What is backpropagation through time (BPTT) and why do RNNs suffer from vanishing gradients?"
        ru: "Что такое BPTT (backpropagation through time) и почему RNN страдают от затухающих градиентов?"
      code: null
    follow_ups:
      en:
        - "How does the gradient depend on the product of W_hh eigenvalues?"
      ru:
        - "Как градиент зависит от произведения собственных значений W_hh?"
    expected_points:
      - "Unroll the RNN over time; backprop like a deep net with shared weights"
      - "Gradient over T steps is a product of T Jacobians (W_hh * diag(tanh'))"
      - "Products shrink (vanish) or explode depending on spectral radius"
      - "Long-range dependencies effectively unlearnable in vanilla RNN"
      - "Truncated BPTT limits the unroll length for stability"

  - id: "dlm-seq-003"
    type: "knowledge"
    difficulty: 3
    tags: ["lstm", "gates", "cell-state"]
    question:
      text:
        en: "Explain the LSTM architecture: input, forget, and output gates, and the cell state."
        ru: "Объясните архитектуру LSTM: входной, забывающий и выходной гейты и cell state."
      code: null
    follow_ups:
      en:
        - "What does the cell state represent and why is it stable?"
      ru:
        - "Что представляет собой cell state и почему он стабилен?"
    expected_points:
      - "Cell state: long-term memory, updated additively (c_t = f_t*c_{t-1} + i_t*tilde_c_t)"
      - "Forget gate: what to discard from cell state (sigmoid)"
      - "Input gate: what new info to store (sigmoid + tanh candidate)"
      - "Output gate: what part of cell state to expose as hidden state"
      - "Gates (sigmoid) modulate information flow, mitigating vanishing"

  - id: "dlm-seq-004"
    type: "knowledge"
    difficulty: 3
    tags: ["gru", "gates"]
    question:
      text:
        en: "How does GRU simplify LSTM? What are its update and reset gates?"
        ru: "Как GRU упрощает LSTM? Что такое update и reset гейты?"
      code: null
    follow_ups:
      en:
        - "When would you choose GRU over LSTM?"
      ru:
        - "Когда выбрать GRU вместо LSTM?"
    expected_points:
      - "GRU: two gates (update z, reset r), no separate cell state"
      - "Update gate blends previous and new hidden state"
      - "Reset gate controls how much past info to use for candidate"
      - "Fewer parameters than LSTM, similar performance"
      - "Often used for small datasets or when LSTM is overkill"

  - id: "dlm-seq-005"
    type: "knowledge"
    difficulty: 4
    tags: ["lstm", "gates", "intuition"]
    question:
      text:
        en: "Intuitively, how do LSTM gates enable learning long-term dependencies?"
        ru: "Интуитивно, как гейты LSTM позволяют обучать долгосрочные зависимости?"
      code: null
    follow_ups:
      en:
        - "What happens to the gradient flowing through the cell state?"
      ru:
        - "Что происходит с градиентом, проходящим через cell state?"
    expected_points:
      - "Cell state changes only additively (multiplicative by forget gate near 1)"
      - "Gradient through cell state: product of forget gates, stays near 1"
      - "Network can 'remember' by keeping forget gate open"
      - "Gates learn when to write/erase information"
      - "Avoids the repeated matrix products that kill RNN gradients"

  - id: "dlm-seq-006"
    type: "knowledge"
    difficulty: 4
    tags: ["seq2seq", "encoder-decoder"]
    question:
      text:
        en: "Describe the seq2seq (encoder-decoder) architecture and how it handles variable-length input/output."
        ru: "Опишите архитектуру seq2seq (encoder-decoder) и как она работает с переменной длиной входа/выхода."
      code: null
    follow_ups:
      en:
        - "What is the information bottleneck of a fixed context vector?"
      ru:
        - "Какова информационная бутылочное горлышко фиксированного контекстного вектора?"
    expected_points:
      - "Encoder reads input sequence, produces context vector (final hidden state)"
      - "Decoder starts from context, generates output sequence step by step"
      - "Handles different input/output lengths (translation, summarization)"
      - "Fixed context is a bottleneck for long inputs"
      - "Typical: bidirectional encoder, unidirectional decoder (LSTM/GRU)"

  - id: "dlm-seq-007"
    type: "knowledge"
    difficulty: 4
    tags: ["attention", "seq2seq", "context"]
    question:
      text:
        en: "What problem does attention solve in seq2seq, and how does Bahdanau attention compute the context vector?"
        ru: "Какую проблему решает attention в seq2seq и как Bahdanau attention вычисляет контекстный вектор?"
      code: null
    follow_ups:
      en:
        - "Why is a weighted sum of all encoder states better than the final state?"
      ru:
        - "Почему взвешенная сумма всех encoder-состояний лучше финального состояния?"
    expected_points:
      - "Attention: decoder looks at relevant encoder positions at each step"
      - "Score alignment (e.g., MLP over h_dec, h_enc), softmax -> weights"
      - "Context = weighted sum of all encoder hidden states"
      - "Each output step uses its own context (dynamic)"
      - "Solves fixed-context bottleneck, improves long-sequence quality"

  - id: "dlm-seq-008"
    type: "knowledge"
    difficulty: 4
    tags: ["teacher-forcing", "exposure-bias"]
    question:
      text:
        en: "What is teacher forcing and what is the exposure bias it causes at inference?"
        ru: "Что такое teacher forcing и какое exposure bias он вызывает при инференсе?"
      code: null
    follow_ups:
      en:
        - "What is scheduled sampling and how does it mitigate exposure bias?"
      ru:
        - "Что такое scheduled sampling и как он смягчает exposure bias?"
    expected_points:
      - "Teacher forcing: feed ground-truth previous tokens during training"
      - "Training: model always sees correct prefixes"
      - "Inference: model sees its own (possibly wrong) outputs"
      - "Exposure bias: train/test distribution mismatch -> error compounding"
      - "Scheduled sampling: mix teacher and sampled tokens over training"

  - id: "dlm-seq-009"
    type: "knowledge"
    difficulty: 4
    tags: ["bleu", "metrics", "nlp"]
    question:
      text:
        en: "What is BLEU and why is it imperfect for evaluating generated text?"
        ru: "Что такое BLEU и почему он не идеален для оценки генерируемого текста?"
      code: null
    follow_ups:
      en:
        - "What is the brevity penalty in BLEU?"
      ru:
        - "Каково brevity penalty в BLEU?"
    expected_points:
      - "BLEU: n-gram precision of hypothesis vs references"
      - "Geometric mean of 1-4 gram precisions"
      - "Brevity penalty: penalizes translations shorter than reference"
      - "Imperfect: rewards fluent n-grams, ignores meaning/fluency fully"
      - "Multiple references help; still correlated poorly with human judgment"

  - id: "dlm-seq-010"
    type: "knowledge"
    difficulty: 4
    tags: ["language-model", "perplexity"]
    question:
      text:
        en: "What is a language model and how is perplexity computed?"
        ru: "Что такое языковая модель и как считается perplexity?"
      code: null
    follow_ups:
      en:
        - "Why is perplexity the exponential of the average cross-entropy?"
      ru:
        - "Почему perplexity — экспонента средней кросс-энтропии?"
    expected_points:
      - "LM: models probability of a sequence of words/tokens"
      - "Factorizes into conditional probs of next token given context"
      - "Perplexity = exp(-1/N * sum log p(w_t|w_<t))"
      - "Interpretation: average branching factor; lower is better"
      - "Used to compare LMs and monitor training"

