        ru: "Как Fast R-CNN улучшает R-CNN (общие свертки, RoI pooling)?"
      code: null
    follow_ups:
      en:
        - "What does RoI pooling produce and why is it size-fixed?"
        - "How are classification and regression heads trained jointly?"
      ru:
        - "Что производит RoI pooling и почему размер фиксирован?"
        - "Как совместно обучаются головы классификации и регрессии?"
    expected_points:
      - "CNN runs once over the whole image to produce a shared feature map"
      - "RoI pooling extracts fixed-size features for each proposal from the shared map"
      - "Eliminates per-region CNN forward passes, greatly speeding inference"
      - "Single multi-task loss jointly trains classifier and box regressor"
      - "End-to-end training except region proposal generation still external"

