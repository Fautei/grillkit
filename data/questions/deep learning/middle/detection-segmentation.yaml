category: "Object Detection and Segmentation"
track: "deep learning"
level: "middle"

description: "Modern object detection and segmentation: two-stage, one-stage, and transformer detectors"

questions:
  - id: "dlm-det-001"
    type: "knowledge"
    difficulty: 3
    tags: ["object-detection", "cnn", "history"]
    question:
      text:
        en: "Why did object detection move from sliding-window classifiers to CNN-based detectors?"
        ru: "Почему детекция объектов перешла от скользящего окна классификаторов к детекторам на основе CNN?"
      code: null
    follow_ups:
      en:
        - "What were the main limitations of HOG/DPM-style sliding windows?"
        - "How did R-CNN reuse CNN features instead of recomputing them per window?"
      ru:
        - "Какие основные ограничения у скользящего окна в стиле HOG/DPM?"
        - "Как R-CNN переиспользовала признаки CNN вместо пересчета для каждого окна?"
    expected_points:
      - "Sliding windows evaluate every location/scale, which is slow and redundant"
      - "Hand-crafted features (HOG) are less expressive than learned CNN features"
      - "CNNs share computation across overlapping regions via feature maps"
      - "Region-based methods reduce the number of candidate locations dramatically"
      - "End-to-end training improves accuracy and simplifies pipelines"

  - id: "dlm-det-002"
    type: "knowledge"
    difficulty: 3
    tags: ["r-cnn", "object-detection", "pipeline"]
    question:
      text:
        en: "Explain the R-CNN pipeline and its main bottleneck."
        ru: "Объясните пайплайн R-CNN и его главное узкое место."
      code: null
    follow_ups:
      en:
        - "How many region proposals does selective search produce per image?"
        - "Why is per-region CNN forward pass expensive?"
      ru:
        - "Сколько предложений регионов дает selective search на одно изображение?"
        - "Почему прогон CNN для каждого региона дорогой?"
    expected_points:
      - "Selective search generates ~2000 region proposals per image"
      - "Each proposal is warped to fixed size and passed through a CNN"
      - "SVMs classify features and bounding box regressors refine boxes"
      - "Main bottleneck: CNN forward pass repeated for every proposal"
      - "Training is multi-stage and slow; no end-to-end optimization"

