  - id: "dlm-diff-021"
    type: "knowledge"
    difficulty: 3
    tags: ["fid", "evaluation", "metrics"]
    question:
      text:
        en: "What is FID and why is it the standard generation metric?"
        ru: "Что такое FID и почему это стандартная метрика генерации?"
      code: null
    follow_ups:
      en:
        - "What does FID compare?"
      ru:
        - "Чем сравнивает FID?"
    expected_points:
      - "FID: Fréchet Inception Distance between real and generated image distributions"
      - "Computes Inception features and compares Gaussian means and covariances"
      - "Lower FID means generated images are closer to real data distribution"
      - "Captures both quality and diversity, not just single-image scores"
      - "Standard because it correlates with human perception and is model-agnostic"

  - id: "dlm-diff-022"
    type: "knowledge"
    difficulty: 3
    tags: ["evaluation", "clip-score", "human-eval"]
    question:
      text:
        en: "How do you evaluate diffusion models beyond FID (CLIP score, human eval)?"
        ru: "Как оценивать diffusion модели помимо FID (CLIP score, человеческая оценка)?"
      code: null
    follow_ups:
      en:
        - "What does CLIP score measure?"
      ru:
        - "Что измеряет CLIP score?"
    expected_points:
      - "CLIP score measures alignment between generated image and text prompt"
      - "Human eval: raters judge quality, prompt alignment, and realism"
      - "Diversity metrics check that outputs cover different concepts and styles"
      - "Benchmark suites (GenEval, DPG-Bench) test structured prompt following"
      - "Use multiple metrics together since no single score captures everything"
