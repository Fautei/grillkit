      - "NMS: keep highest-confidence box, suppress overlapping boxes (IoU > threshold)"
      - "Applied per class (class-aware NMS)"
      - "Soft-NMS: reduces score instead of deleting, keeps partially overlapping boxes"
      - "Threshold choice affects recall vs duplicates"

  - id: "dlm-cnn-018"
