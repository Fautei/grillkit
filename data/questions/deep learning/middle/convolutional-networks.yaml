    follow_ups:
      en:
        - "What is the Dice coefficient and why is it a good metric for segmentation?"
      ru:
        - "Что такое коэффициент Дайса и почему он хороший метрик для сегментации?"
    expected_points:
      - "Cross-entropy per pixel; but background dominates"
      - "Class weights / focal loss reweight rare classes"
      - "Dice loss: 2*|A∩B| / (|A|+|B|), robust to class imbalance"
      - "Combined CE+Dice common for medical segmentation"
      - "Background-heavy images need boundary-aware losses"

