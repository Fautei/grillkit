questions:
  - id: "dlm-cnn-001"
    type: "knowledge"
    difficulty: 3
    tags: ["cnn", "convolution", "kernel"]
    question:
      text:
        en: "How does a 2D convolution work? Explain stride, padding, and how they affect output size."
        ru: "Как работает 2D-свёртка? Объясните stride, padding и как они влияют на размер вывода."
      code: null
    follow_ups:
      en:
        - "Derive the output size formula for given input, kernel, stride, padding."
      ru:
        - "Выведите формулу размера вывода для заданных input, kernel, stride, padding."
    expected_points:
      - "Conv: slide kernel over input, compute dot product, add bias"
      - "Stride: step size; padding: add zeros at borders"
      - "Output size: O = (I + 2P - K)/S + 1"
      - "Stride>1 downsamples spatially; padding preserves size"
      - "Each output channel = independent filter stack"

  - id: "dlm-cnn-002"
    type: "knowledge"
    difficulty: 3
    tags: ["cnn", "filters", "channels"]
    question:
      text:
        en: "What is a filter/kernel in CNN and why do networks learn more complex filters in deeper layers?"
        ru: "Что такое фильтр/ядро в CNN и почему сеть учит более сложные фильтры в глубоких слоях?"
      code: null
    follow_ups:
      en:
        - "What do early vs late conv layers typically detect?"
      ru:
        - "Что обычно детектят ранние и поздние conv-слои?"
    expected_points:
      - "Kernel: 3D weight tensor (C_in, K, K) producing one output channel"
      - "Weight sharing: same kernel across spatial positions"
      - "Early layers: edges, colors, textures (local features)"
      - "Deeper layers: object parts, whole objects (composite features)"
      - "Hierarchical feature composition is the core of CNNs"

  - id: "dlm-cnn-003"
    type: "knowledge"
    difficulty: 3
    tags: ["cnn", "pooling", "downsampling"]
    question:
      text:
        en: "What are max pooling and average pooling? Why do they help CNNs?"
        ru: "Что такое max pooling и average pooling? Почему они полезны в CNN?"
      code: null
    follow_ups:
      en:
        - "What is global average pooling and why is it used?"
      ru:
        - "Что такое global average pooling и зачем он используется?"
    expected_points:
      - "Pooling: reduce spatial size, keep most important values"
      - "Max pooling: take maximum over a window (feature presence)"
      - "Average pooling: mean over window (smoother)"
      - "Provides translation invariance and reduces compute"
      - "Global Average Pooling: one value per channel, replaces FC, fewer params"

  - id: "dlm-cnn-004"
    type: "knowledge"
    difficulty: 3
    tags: ["cnn", "vgg", "alexnet"]
    question:
      text:
        en: "Compare VGG, AlexNet, and GoogLeNet design philosophies. What was each famous for?"
        ru: "Сравните философии VGG, AlexNet и GoogLeNet. Чем каждая была знаменита?"
      code: null
    follow_ups:
      en:
        - "Why did VGG use many small 3x3 convolutions instead of large ones?"
      ru:
        - "Почему VGG использовала множество маленьких 3x3 сверток вместо больших?"
    expected_points:
      - "AlexNet (2012): first deep CNN to win ImageNet, ReLU, Dropout, GPU"
      - "VGG (2014): deep (19 layers), uniform 3x3 convs, simple but strong"
      - "GoogLeNet (2014): Inception modules, multi-scale, efficient"
      - "Two 3x3 convs = same receptive field as 5x5 with more nonlinearity + fewer params"
      - "Marked the shift to deeper, more efficient architectures"

  - id: "dlm-cnn-005"
    type: "knowledge"
    difficulty: 3
    tags: ["resnet", "skip", "residual"]
    question:
      text:
        en: "Explain the ResNet residual block and why it solved the degradation problem."
        ru: "Объясните residual-блок ResNet и почему он решил проблему деградации."
      code: null
    follow_ups:
      en:
        - "What is the difference between basic and bottleneck ResNet blocks?"
      ru:
        - "Чем базовый блок ResNet отличается от bottleneck?"
    expected_points:
      - "Residual block: output = F(x) + x (skip/shortcut connection)"
      - "Network learns residual H(x)-x, easier than H(x) directly"
      - "Identity shortcut preserves gradient flow to early layers"
      - "Enables training of 50/100+ layer networks without degradation"
      - "Basic: two 3x3 convs; bottleneck: 1x1-3x3-1x1 (reduces params)"

  - id: "dlm-cnn-006"
    type: "knowledge"
    difficulty: 3
    tags: ["resnet", "bottleneck", "1x1"]
    question:
      text:
        en: "What is the purpose of 1x1 convolutions in ResNet and other architectures?"
        ru: "Каково назначение сверток 1x1 в ResNet и других архитектурах?"
      code: null
    follow_ups:
      en:
        - "How does a 1x1 conv change the number of channels?"
      ru:
        - "Как свёртка 1x1 меняет число каналов?"
    expected_points:
      - "1x1 conv: cross-channel linear combination, no spatial mixing"
      - "Reduces channel dim (bottleneck) then expands it"
      - "Cuts compute: cheaper to operate in low channel space"
      - "Adds nonlinearity between projections"
      - "Used in Inception, ResNet bottleneck, efficient nets"

  - id: "dlm-cnn-007"
