      - "R-CNN: selective search proposals + CNN features + SVM (slow)"
      - "Fast R-CNN: shared CNN over whole image, RoI pooling, end-to-end (faster)"
      - "Faster R-CNN: Region Proposal Network (RPN) learns proposals (much faster)"
      - "Two-stage: propose regions, then classify/regress each"
      - "RoI pooling aligns variable-size regions to fixed size"

  - id: "dlm-cnn-014"
