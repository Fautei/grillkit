      - "Single forward pass -> real-time (end-to-end regression)"
      - "Predicts bbox coordinates, confidence, class probabilities"
      - "NMS (non-max suppression) removes duplicate detections"
      - "Trade-off: speed over precision on small/occluded objects"

  - id: "dlm-cnn-017"
