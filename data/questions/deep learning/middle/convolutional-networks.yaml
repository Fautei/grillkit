      - "Ground-truth matched to anchor by IoU threshold"
      - "IoU > high threshold -> positive; below low -> negative"
      - "Anchor-free approaches (FCOS, RetinaNet) predict boxes directly"
      - "Balance of pos/neg via mining (focal loss in RetinaNet)"

  - id: "dlm-cnn-015"
    type: "knowledge"
    difficulty: 4
    tags: ["detection", "focal-loss", "retinanet"]
    question:
      text:
        en: "What is the focal loss and why did RetinaNet need it for a single-stage detector?"
        ru: "Что такое focal loss и почему он нужен RetinaNet для single-stage детектора?"
      code: null
    follow_ups:
      en:
        - "How does the gamma parameter of focal loss affect training?"
      ru:
        - "Как параметр gamma focal loss влияет на обучение?"
    expected_points:
      - "Single-stage detectors generate many anchors -> extreme pos/neg imbalance"
      - "Focal loss: FL = -(1-p)^gamma * log(p), down-weights easy negatives"
      - "gamma (e.g., 2) focuses learning on hard examples"
      - "alpha balances pos/neg class weights"
      - "Enables single-stage accuracy rivaling two-stage detectors"

