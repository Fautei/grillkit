      - "Keeps full spatial resolution for pixel-wise prediction"
      - "ASPP (Atrous Spatial Pyramid): multi-rate dilations capture context at scales"
      - "Aliasing: high-rate dilations can create artifacts; multi-rate mixes fix it"
      - "Used in DeepLab family for accurate segmentation maps"

