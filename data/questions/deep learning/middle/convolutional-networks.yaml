      - "U-Net: symmetric encoder-decoder with skip connections between levels"
      - "Skip connections fuse high-res details with high-level semantics"
      - "Essential for precise boundaries in segmentation"
      - "Transposed conv (or upsample) in decoder increases spatial size"

