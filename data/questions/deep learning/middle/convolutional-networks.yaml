        - "How many FLOPs does a depthwise separable conv save vs a standard conv?"
      ru:
        - "Сколько FLOPs экономит depthwise separable conv против стандартной?"
    expected_points:
      - "Depthwise separable: per-channel spatial conv (depthwise) + 1x1 pointwise"
      - "Decouples spatial and channel mixing — drastically fewer FLOPs"
      - "Saves ~8-9x compute vs standard conv for typical channel counts"
      - "MobileNet: depthwise separable convs for mobile efficiency"
      - "EfficientNet: compound scaling (depth, width, resolution) via NAS"

  - id: "dlm-cnn-009"
    type: "knowledge"
