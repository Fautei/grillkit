      code: null
    follow_ups:
      en:
        - "Why do dilated convolutions expand the receptive field?"
      ru:
        - "Почему разряженные (dilated) свёртки расширяют рецептивное поле?"
    expected_points:
      - "Receptive field: input region influencing one output unit"
      - "Grows with depth and kernel size; pooling/stride also expand it"
      - "Dilated (atrous) conv: insert zeros in kernel, larger field without losing resolution"
      - "Dilation rate r: kernel covers (K-1)*r+1 input points"
      - "Large receptive field = better context, but needs many layers to grow"

