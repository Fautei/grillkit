      text:
        en: "What losses are used for semantic segmentation and why is plain cross-entropy insufficient for imbalanced classes?"
        ru: "Какие функции потерь используются для семантической сегментации и почему обычная кросс-энтропия недостаточна при несбалансированных классах?"
