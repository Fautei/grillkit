      ru:
        - "Почему Inception-модули используют 1x1 свёртки перед большими?"
    expected_points:
      - "Parallel branches with different kernel sizes (1x1, 3x3, 5x5, pooling)"
      - "Each branch captures features at a different receptive field"
      - "Concatenate outputs to combine multi-scale representations"
      - "1x1 convs reduce channel count to keep cost manageable"
      - "Allows the network to learn optimal feature mix"

  - id: "dlm-cnn-008"
