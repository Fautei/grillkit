category: "Inference Serving and Quantization"
track: "deep learning"
level: "senior"
description: "Production LLM serving: quantization, compression, batching, and serving infrastructure for senior engineers"

questions:
  - id: "dls-serve-001"
    type: "knowledge"
    difficulty: 4
    tags: ["quantization", "weights", "activations"]
    question:
      text:
        en: "What is the difference between weight-only and full (weight+activation) quantization?"
        ru: "В чем разница между квантизацией только весов и полной квантизацией (веса + активации)?"
      code: null
    follow_ups:
      en:
        - "Why does full quantization tend to be more challenging than weight-only quantization?"
      ru:
        - "Почему полная квантизация обычно сложнее квантизации только весов?"
    expected_points:
      - "Weight-only quantizes only model weights; full quantizes weights and activations"
      - "Weight-only is easier to deploy and preserves accuracy better in many LLM cases"
      - "Full quantization enables lower precision math on activations and often faster inference on integer GEMMs"
      - "Full quantization is more sensitive to activation outliers"

  - id: "dls-serve-002"
    type: "knowledge"
    difficulty: 4
    tags: ["ptq", "qat", "calibration"]
    question:
      text:
        en: "What is PTQ vs QAT and when is each used?"
        ru: "В чем разница между PTQ и QAT и когда следует использовать каждый из них?"
      code: null
    follow_ups:
      en:
        - "What are the typical compute and data requirements for each approach?"
      ru:
        - "Каковы типичные требования к вычислительным ресурсам и данным для каждого подхода?"
    expected_points:
      - "PTQ (Post-Training Quantization) quantizes a trained model without full retraining"
      - "QAT (Quantization-Aware Training) simulates quantization during fine-tuning or training"
      - "PTQ is cheaper and faster, used when calibration data is limited or retraining is infeasible"
      - "QAT is more accurate at low bitwidths but requires training compute and access to training data"

  - id: "dls-serve-003"
    type: "knowledge"
    difficulty: 5
    tags: ["gptq", "hessian", "ptq"]
    question:
      text:
        en: "What is GPTQ and how does it work (Hessian-based)?"
        ru: "Что такое GPTQ и как он работает (на основе матрицы Гессе)?"
      code: null
    follow_ups:
      en:
        - "Why is GPTQ considered efficient for large LLMs compared to naive layer-wise quantization?"
      ru:
        - "Почему GPTQ считается эффективным для больших LLM по сравнению с наивной послойной квантизацией?"
    expected_points:
      - "GPTQ is a one-shot weight-only PTQ method for LLMs"
      - "It uses approximate second-order information from the Hessian of layer reconstruction loss"
      - "Weights are quantized column/group-wise with error compensation to minimize quantization error"
      - "It can achieve 4-bit with minimal accuracy loss and runs efficiently via layer-wise processing"

  - id: "dls-serve-004"
    type: "knowledge"
    difficulty: 5
    tags: ["awq", "activation", "ptq"]
    question:
      text:
        en: "What is AWQ and why is it popular for LLMs?"
        ru: "Что такое AWQ и почему он популярен для LLM?"
      code: null
    follow_ups:
      en:
        - "How does AWQ differ from GPTQ in its approach to quantization?"
      ru:
        - "Чем AWQ отличается от GPTQ в подходе к квантизации?"
    expected_points:
      - "AWQ (Activation-aware Weight Quantization) is a weight-only PTQ method"
      - "It protects salient weights by observing activation magnitudes rather than just weight values"
      - "Uses per-channel scaling of weights based on activation statistics to preserve important channels"
      - "Popular due to strong accuracy at 4-bit, simple deployment, and good hardware compatibility"

  - id: "dls-serve-005"
    type: "knowledge"
    difficulty: 5
    tags: ["smoothquant", "outliers", "activations"]
    question:
      text:
        en: "What is SmoothQuant and how does it handle activation outliers?"
        ru: "Что такое SmoothQuant и как он справляется с выбросами в активациях?"
      code: null
    follow_ups:
      en:
        - "Why is migrating quantization difficulty from activations to weights beneficial?"
      ru:
        - "Почему выгодно перенести сложность квантизации с активаций на веса?"
    expected_points:
      - "SmoothQuant is a post-training method for W8A8 (weight and activation) quantization"
      - "It smooths activation outliers by mathematically scaling them down and scaling corresponding weights up"
      - "The transformation is offline and preserves mathematical equivalence of the model"
      - "This makes activations easier to quantize to INT8 while keeping weights quantizable with minimal accuracy loss"

  - id: "dls-serve-006"
