    difficulty: 4
    tags: ["int4", "accuracy", "tradeoff"]
    question:
      text:
        en: "What is the impact of INT4 quantization on model quality?"
        ru: "Как влияет квантизация в INT4 на качество модели?"
      code: null
    follow_ups:
      en:
        - "In what cases can INT4 cause noticeable degradation versus larger bitwidths?"
      ru:
        - "В каких случаях INT4 может привести к заметному ухудшению качества по сравнению с большими битностями?"
    expected_points:
      - "INT4 can achieve significant memory and speed gains with small quality loss for many LLMs"
      - "Weight-only INT4 is often acceptable; W4A4 is more sensitive to outliers and implementation details"
      - "Degradation depends on model size, architecture, calibration data, and quantization method used"
      - "Very small models or tasks requiring high precision may show larger drops"

  - id: "dls-serve-007"
