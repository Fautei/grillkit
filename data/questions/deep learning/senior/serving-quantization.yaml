    expected_points:
      - "Disaggregated serving runs prefill and decode on different GPU pools with independent scaling"
      - "Allows optimizing hardware/parallelism per phase and avoiding interference between them"
      - "Improves resource utilization and can meet different SLOs for TTFT and TPOT separately"
      - "Requires KV cache transfer between pools which adds network overhead and complexity"

  - id: "dls-serve-021"
