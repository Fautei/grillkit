      - "SLOs are set based on user experience, use case (chat vs batch), and cost/latency trade-offs"
      - "Measured via server logs/timings, load tests, and percentiles (p50/p90/p99) in production"
      - "Queueing, batch size, context length, and KV cache pressure can cause SLO violations under load"

  - id: "dls-serve-024"
