    expected_points:
      - "Continuous batching adds and removes requests from the batch at each iteration as they arrive/complete"
      - "vLLM uses an iteration-level scheduler to form batches dynamically across prefill and decode"
      - "This maximizes GPU utilization compared to waiting for a fixed batch to finish"
      - "Enables higher throughput and lower average latency in multi-tenant serving"

  - id: "dls-serve-018"
    type: "knowledge"
    difficulty: 5
    tags: ["pagedattention", "kv", "memory"]
    question:
      text:
        en: "What is PagedAttention and how does it improve throughput?"
        ru: "Что такое PagedAttention и как он повышает пропускную способность?"
      code: null
    follow_ups:
      en:
