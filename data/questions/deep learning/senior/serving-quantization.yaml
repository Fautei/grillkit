      - "Unstructured pruning removes individual weights (sparse matrices) with minimal accuracy loss"
      - "Structured pruning removes entire channels/heads/layers for regular sparsity patterns"
      - "Structured pruning gives better real speedup on hardware; unstructured needs specialized sparse kernels"

  - id: "dls-serve-012"
