        - "Какая аппаратная поддержка требуется для ускорения при использовании 2:4 разреженности?"
    expected_points:
      - "2:4 sparsity means in every block of 4 weights, exactly 2 are zero (50% sparsity)"
      - "NVIDIA Ampere and newer GPUs have Sparse Tensor Cores that accelerate 2:4 sparse GEMMs"
      - "Requires the sparse matrix to be stored in compressed format"
      - "Can provide up to ~2x speedup for supported matrix multiply operations with acceptable accuracy loss"

