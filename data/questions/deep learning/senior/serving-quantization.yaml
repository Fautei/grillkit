      code: null
    follow_ups:
      en:
        - "How does FP8 compare to INT8 in terms of dynamic range and usability?"
      ru:
        - "Как FP8 соотносится с INT8 по диапазону значений и удобству использования?"
    expected_points:
      - "FP8 is an 8-bit floating point format (E4M3 and E5M2 variants) with exponent and mantissa"
      - "It offers better dynamic range than INT8, helping with activation outliers"
      - "Supported by modern GPUs (H100, etc.), enabling faster tensor core operations"
      - "Emerging for both training (mixed precision) and inference due to efficiency and easier accuracy preservation"

  - id: "dls-serve-008"
    type: "knowledge"
    difficulty: 5
    tags: ["kv-cache", "quantization", "memory"]
    question:
      text:
        en: "How do you quantize the KV cache and what is the quality trade-off?"
        ru: "Как квантизировать KV-кеш и каков компромисс в качестве?"
      code: null
    follow_ups:
      en:
        - "Why is KV cache quantization especially important for long-context serving?"
      ru:
        - "Почему квантизация KV-кеша особенно важна при обслуживании с большим контекстом?"
    expected_points:
      - "KV cache can be quantized per-token or per-channel to lower precision (INT8, INT4, FP8)"
      - "Reduces memory usage and can improve throughput for long contexts and high batch sizes"
      - "Quality trade-off increases as bitwidth drops, especially for very long sequences or sensitive tasks"
      - "Methods often use per-token scaling or asymmetric quantization to preserve accuracy"

  - id: "dls-serve-009"
