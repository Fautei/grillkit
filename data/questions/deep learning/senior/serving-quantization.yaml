      ru:
        - "Чем PagedAttention похож на виртуальную память в операционных системах?"
    expected_points:
      - "PagedAttention manages KV cache in fixed-size blocks (pages) instead of contiguous arrays"
      - "Allows flexible allocation, sharing of blocks across requests (e.g. prefix caching), and less fragmentation"
      - "Improves memory utilization, enabling larger batch sizes and longer contexts on same GPU"
      - "Leads to higher throughput and better scalability for LLM serving"

  - id: "dls-serve-019"
    type: "knowledge"
    difficulty: 5
    tags: ["prefill", "decode", "phases"]
    question:
      text:
        en: "What is the difference between prefill and decode phases, and why serve them differently?"
        ru: "В чем разница между фазами prefill и decode, и почему их нужно обрабатывать по-разному?"
      code: null
    follow_ups:
      en:
        - "Which phase is typically more compute-bound vs memory-bound?"
      ru:
        - "Какая фаза обычно ограничена вычислениями, а какая - памятью?"
    expected_points:
      - "Prefill processes the entire input prompt in parallel to generate first tokens and build KV cache"
      - "Decode generates tokens autoregressively one (or few) at a time using the KV cache"
      - "Prefill is compute-heavy (large matrix multiplies), decode is memory-bandwidth heavy (KV cache access)"
      - "Serving differently (e.g. disaggregation, different batching) optimizes for their distinct bottlenecks"

  - id: "dls-serve-020"
