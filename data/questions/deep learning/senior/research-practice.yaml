category: "Research Practice and Evaluation"
track: "deep learning"
level: "senior"
description: "Experiment design, benchmarks, reproducibility, and model release practices for senior engineers"

questions:
  - id: "dls-research-001"
    type: "knowledge"
    difficulty: 5
    tags: ["ablation", "experiment", "design"]
    question:
      text:
        en: "How do you design a good ablation study?"
        ru: "Как правильно спроектировать исследование абляций?"
      code: null
    follow_ups:
      en:
        - "How do you decide which components to ablate first?"
        - "When should you run controlled vs isolated ablations?"
      ru:
        - "Как определить, какие компоненты следует аблировать в первую очередь?"
        - "В каких случаях предпочтительны контролируемые, а в каких - изолированные абляции?"
    expected_points:
      - "Define a clear hypothesis for each ablated component"
      - "Change one factor at a time with matched training conditions"
      - "Keep data, seeds, architecture scope, and compute fixed"
      - "Measure effect size with uncertainty or multiple runs"
      - "Distinguish necessity from sufficiency in conclusions"

  - id: "dls-research-002"
    type: "knowledge"
    difficulty: 4
    tags: ["benchmark", "evaluation", "task"]
    question:
      text:
        en: "What is a benchmark, and how do you choose the right one for a task?"
        ru: "Что такое бенчмарк и как выбрать подходящий бенчмарк для решаемой задачи?"
      code: null
    follow_ups:
      en:
        - "When is a public benchmark misleading for your use case?"
        - "How do you avoid overfitting to a benchmark?"
      ru:
        - "В каких случаях публичный бенчмарк может вводить в заблуждение применительно к вашей задаче?"
        - "Как избежать переобучения на бенчмарке?"
    expected_points:
      - "Define benchmark as a standardized test with fixed data and metric"
      - "Match task distribution, domain, and language to target use case"
      - "Consider label quality, license, and test set contamination"
      - "Prefer established baselines and known evaluation protocol"
      - "Validate with held-out or realistic test data"

  - id: "dls-research-003"
    type: "knowledge"
    difficulty: 5
    tags: ["benchmark", "saturation", "evaluation"]
    question:
      text:
        en: "What is benchmark saturation, and why is it a problem?"
        ru: "Что такое насыщение бенчмарка (benchmark saturation) и почему это проблема?"
      code: null
    follow_ups:
      en:
        - "How can you detect benchmark saturation?"
        - "What alternatives help when a benchmark is saturated?"
      ru:
        - "Как можно обнаружить насыщение бенчмарка?"
        - "Какие альтернативы можно использовать, если бенчмарк уже насыщен?"
    expected_points:
      - "Define saturation as near-ceiling performance with little headroom"
      - "Explain reduced discriminative power between models"
      - "Note risk of chasing noise or leaderboard gaming"
      - "Mention test set leakage and label ambiguity effects"
      - "Suggest harder splits, error analysis, or new tasks"

  - id: "dls-research-004"
    type: "knowledge"
    difficulty: 5
    tags: ["reproducibility", "seed", "environment"]
    question:
      text:
        en: "How do you ensure reproducibility of an experiment (seeds, environment, data)?"
        ru: "Как обеспечить воспроизводимость эксперимента (seeds, окружение, данные)?"
      code: null
    follow_ups:
      en:
        - "What sources of nondeterminism are easiest to miss?"
        - "How much determinism is practical for large-scale training?"
      ru:
        - "Какие источники недетерминизма чаще всего упускают из виду?"
        - "Насколько детерминизм реалистичен при крупномасштабном обучении?"
    expected_points:
      - "Fix random seeds for numpy, torch, and dataloaders"
      - "Pin environment with dependencies, CUDA, and versions"
      - "Version data, splits, preprocessing, and checksums"
      - "Record configs, checkpoints, and training scripts"
      - "Document known nondeterminism and report variance across runs"

  - id: "dls-research-005"
    type: "knowledge"
    difficulty: 5
    tags: ["compute", "budget", "allocation"]
    question:
      text:
        en: "What is the compute budget problem, and how do you allocate it?"
        ru: "В чём суть проблемы вычислительного бюджета и как его рационально распределить?"
      code: null
    follow_ups:
      en:
        - "When should you prefer scaling data vs scaling model?"
        - "How do you avoid wasting compute on unpromising runs?"
      ru:
        - "Когда лучше масштабировать данные, а когда - модель?"
        - "Как избежать пустой траты вычислительных ресурсов на бесперспективные прогоны?"
    expected_points:
      - "Define tradeoff between exploration and final large runs"
      - "Use scaling laws or pilot experiments to estimate returns"
      - "Allocate to baselines, ablations, and hyperparameter search first"
      - "Prefer efficient search (random/ASHA/BO) over brute force"
      - "Track FLOPs/time and set stopping criteria"

  - id: "dls-research-006"
    type: "knowledge"
    difficulty: 4
    tags: ["negative", "results", "reporting"]
    question:
      text:
        en: "How do you report negative results and what is their value?"
        ru: "Как правильно сообщать о негативных результатах и какова их ценность?"
      code: null
    follow_ups:
      en:
        - "What details must be reported for a negative result to be useful?"
        - "How do you avoid publishing a failed experiment without insight?"
      ru:
        - "Какие детали необходимо привести, чтобы негативный результат был полезен?"
        - "Как не публиковать просто неудачный эксперимент без выводов?"
    expected_points:
      - "Report setup, hypothesis, and what was tested"
      - "Include baselines, metrics, and number of runs"
      - "Explain likely causes and constraints discovered"
      - "Prevent duplication and save compute for others"
      - "Focus on insights, not just failure"

  - id: "dls-research-007"
    type: "knowledge"
    difficulty: 5
    tags: ["hyperparameter", "search", "asha", "bo"]
    question:
      text:
        en: "What is a hyperparameter search strategy (grid, random, ASHA, BO)?"
        ru: "Что представляют собой стратегии поиска гиперпараметров (grid, random, ASHA, BO)?"
      code: null
    follow_ups:
      en:
        - "When is ASHA better than random search?"
        - "When would you choose Bayesian optimization over ASHA?"
      ru:
        - "В каких случаях ASHA лучше случайного поиска?"
        - "В каких случаях байесовская оптимизация предпочтительнее ASHA?"
    expected_points:
      - "Compare grid (exhaustive) vs random (coverage with less cost)"
      - "Explain ASHA for early stopping of poor trials"
      - "Explain BO for sample-efficient search with surrogate model"
      - "Consider search space, budget, and parallelism"
      - "Recommend starting simple before complex methods"

  - id: "dls-research-008"
    type: "knowledge"
    difficulty: 4
    tags: ["tracking", "wandb", "mlflow", "logging"]
    question:
      text:
        en: "How do you track experiments (W&B, MLflow) and what to log?"
        ru: "Как организовать трекинг экспериментов (W&B, MLflow) и что логировать?"
      code: null
    follow_ups:
