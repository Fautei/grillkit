        - "What should be logged to debug a regression?"
        - "How do you organize runs for a large ablation suite?"
      ru:
        - "Что стоит логировать для диагностики регрессии?"
        - "Как организовать прогоны для большого набора абляций?"
    expected_points:
      - "Log config, git commit, seeds, and environment"
      - "Log metrics, losses, learning rate, and system stats"
      - "Log artifacts like checkpoints, plots, and eval results"
      - "Use tags/groups for ablations and comparisons"
      - "Ensure reproducibility and easy comparison across runs"

  - id: "dls-research-009"
    type: "knowledge"
    difficulty: 5
    tags: ["paper", "critical", "reading"]
    question:
      text:
        en: "How do you read a research paper critically (what to check first)?"
        ru: "Как критически читать научную статью (с чего начать проверку)?"
      code: null
    follow_ups:
      en:
        - "How do you spot hidden assumptions in a method?"
        - "When should you trust reported gains?"
      ru:
        - "Как выявить скрытые допущения в методе?"
        - "Когда можно доверять заявленному улучшению?"
    expected_points:
      - "Check problem statement, novelty, and claimed contribution"
      - "Inspect baselines, datasets, and evaluation protocol"
      - "Look for ablations, limitations, and compute details"
      - "Check reproducibility info and potential data leakage"
      - "Assess significance vs marginal gains"

  - id: "dls-research-010"
    type: "knowledge"
    difficulty: 4
    tags: ["baseline", "comparison", "evaluation"]
    question:
      text:
        en: "What is the role of baselines in a paper, and how to pick them?"
        ru: "Какова роль базовых моделей (baselines) в статье и как их правильно выбрать?"
      code: null
    follow_ups:
      en:
        - "When is a weak baseline misleading?"
        - "Should you include strong concurrent baselines?"
      ru:
        - "Когда слабый baseline вводит в заблуждение?"
        - "Стоит ли включать сильные конкурирующие baselines?"
    expected_points:
      - "Baselines establish value and isolate contribution"
      - "Pick standard, well-tuned baselines for the task"
      - "Match training data and compute as much as possible"
      - "Include simple and state-of-the-art baselines"
      - "Justify choices and report tuning details"

  - id: "dls-research-011"
    type: "knowledge"
    difficulty: 5
    tags: ["llm", "evaluation", "probe", "capability"]
    question:
      text:
        en: "How do you evaluate a new LLM capability (designing a probe)?"
        ru: "Как оценить новое capability у LLM (как спроектировать пробу)?"
      code: null
    follow_ups:
      en:
        - "How do you avoid prompt sensitivity bias?"
        - "When is a behavioral probe better than a benchmark?"
      ru:
        - "Как избежать смещения из-за чувствительности к промпту?"
        - "В каких случаях поведенческая проба лучше формального бенчмарка?"
    expected_points:
      - "Define capability, failure modes, and success criteria"
      - "Design minimal, controlled prompts with clear labels"
      - "Use diverse examples and avoid train-test leakage"
