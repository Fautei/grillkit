      code: null
    follow_ups:
      en:
        - "What is a hard blocker vs a known limitation?"
        - "When should you do a staged release?"
      ru:
        - "В чём разница между блокирующим дефектом и известным ограничением?"
        - "В каких случаях предпочтителен поэтапный релиз?"
