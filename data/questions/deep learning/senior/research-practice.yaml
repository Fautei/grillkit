      - "Report variance across seeds/prompts and human check"

  - id: "dls-research-012"
    type: "knowledge"
    difficulty: 5
    tags: ["redteam", "safety", "evaluation"]
    question:
      text:
        en: "What is red-teaming and how do you do it systematically?"
        ru: "Что такое red-teaming и как проводить его систематически?"
      code: null
    follow_ups:
      en:
        - "How do you balance coverage and realism?"
        - "When should you escalate findings?"
      ru:
        - "Как сбалансировать полноту покрытия и реалистичность тестов?"
        - "В каких случаях следует эскалировать найденные уязвимости?"
    expected_points:
      - "Define scope, risk categories, and success metrics"
      - "Use taxonomy-driven attacks with human and automated methods"
