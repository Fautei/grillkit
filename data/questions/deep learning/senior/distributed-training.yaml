      - "All-reduce operations on bf16 gradients are faster and use less bandwidth"
      - "Master weights and optimizer states remain in fp32 for numerical stability during updates"
      - "Loss scaling may be needed for fp16 to avoid underflow, while bf16 has wider exponent range reducing scaling needs"
  - id: "dls-dd-008"
