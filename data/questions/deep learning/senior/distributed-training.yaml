category: "Distributed Training at Scale"
track: "deep learning"
level: "senior"
description: "Data, tensor, and pipeline parallelism, ZeRO/FSDP, and multi-node training systems for senior engineers"

questions:
  - id: "dls-dd-001"
    type: "knowledge"
    difficulty: 5
    tags: ["ddp", "data-parallel", "synchronization"]
    question:
      text:
        en: "Compare data parallelism (DP) and distributed data parallelism (DDP): what is synchronized?"
        ru: "Сравните data parallelism (DP) и distributed data parallelism (DDP): что именно синхронизируется?"
      code: null
    follow_ups:
      en:
        - "How do communication patterns differ between DP and DDP?"
      ru:
        - "Чем отличаются паттерны коммуникации между DP и DDP?"
    expected_points:
      - "DP uses parameter server or shared gradients from all workers; DDP synchronizes gradients across all processes via collective communication"
      - "DDP keeps a separate model replica per process and performs all-reduce on gradients during backward pass"
      - "Only gradients are synchronized in DDP, not parameters directly during forward pass like naive DP"
      - "DDP ensures identical model states after each optimizer step across all replicas"
  - id: "dls-dd-002"
    type: "knowledge"
    difficulty: 5
    tags: ["ddp", "gradient-bucketing", "gil"]
    question:
      text:
        en: "Why is DDP better than classic DataParallel (gradient bucketing, no GIL)?"
        ru: "Почему DDP лучше классического DataParallel (gradient bucketing, отсутствие GIL)?"
      code: null
    follow_ups:
      en:
        - "How does the GIL impact classic DataParallel performance?"
      ru:
        - "Как GIL влияет на производительность классического DataParallel?"
    expected_points:
      - "DDP uses multi-process execution avoiding Python GIL contention present in multi-threaded DataParallel"
      - "Gradient bucketing groups small gradients into buckets and overlaps communication with computation"
      - "DDP uses efficient collective ops like all-reduce instead of gather/scatter via parameter server patterns"
      - "DDP scales better to multi-GPU and multi-node setups with lower overhead"
  - id: "dls-dd-003"
    type: "knowledge"
    difficulty: 5
    tags: ["ring-allreduce", "bandwidth", "collective"]
    question:
      text:
        en: "What is the ring all-reduce algorithm and why is it bandwidth-optimal?"
        ru: "Что такое алгоритм ring all-reduce и почему он оптимален по пропускной способности?"
      code: null
    follow_ups:
      en:
        - "How does ring all-reduce compare to tree-based approaches?"
      ru:
        - "Как ring all-reduce сравнивается с подходами на основе дерева?"
    expected_points:
      - "Ring all-reduce forms a ring of N processes and performs scatter-reduce followed by all-gather in phases"
      - "Each process sends/receives data to adjacent peers, maximizing link utilization"
      - "Total data transferred is N-1 steps * (data/N) per link but effectively each byte crosses each link once, achieving O(1) bandwidth cost independent in optimal form"
      - "Bandwidth optimal means it saturates available network bandwidth without redundant transfers unlike naive all-reduce"
  - id: "dls-dd-004"
    type: "knowledge"
    difficulty: 5
    tags: ["zero", "fsdp", "sharding"]
    question:
      text:
        en: "Explain ZeRO stages 1/2/3: what is sharded in each?"
        ru: "Объясните стадии ZeRO 1/2/3: что именно расщепляется (sharded) на каждой стадии?"
      code: null
    follow_ups:
      en:
        - "How does memory savings increase across ZeRO stages?"
      ru:
        - "Как растет экономия памяти по стадиям ZeRO?"
    expected_points:
      - "ZeRO-1 shards optimizer states across data parallel ranks, keeping full model and gradients on each rank"
      - "ZeRO-2 shards optimizer states and gradients across ranks, keeping full model on each rank"
      - "ZeRO-3 shards optimizer states, gradients, and model parameters across ranks with on-the-fly gathering when needed"
      - "Communication overhead increases across stages while memory usage decreases significantly"
  - id: "dls-dd-005"
    type: "knowledge"
    difficulty: 5
    tags: ["fsdp", "zero-3", "pytorch"]
    question:
      text:
        en: "What is FSDP and how does it map ZeRO-3 to PyTorch?"
        ru: "Что такое FSDP и как он отображает ZeRO-3 на PyTorch?"
      code: null
    follow_ups:
      en:
        - "What are key FSDP configuration options?"
      ru:
        - "Какие ключевые параметры конфигурации есть у FSDP?"
    expected_points:
      - "Fully Sharded Data Parallel (FSDP) is PyTorch implementation that shards parameters, gradients, and optimizer states like ZeRO-3"
      - "FSDP wraps modules and uses all-gather to collect full parameters before forward/backward of each wrapped unit, then frees shards"
      - "It supports flat parameter storage, mixed precision, and different sharding strategies (FULL_SHARD, SHARD_GRAD_OP, NO_SHARD)"
      - "FSDP integrates with PyTorch autograd and provides checkpointing and CPU offload capabilities"
  - id: "dls-dd-006"
