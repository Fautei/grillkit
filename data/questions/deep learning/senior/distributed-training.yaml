      ru:
        - "Какие факторы влияют на выбор алгоритма в NCCL?"
    expected_points:
      - "NCCL (NVIDIA Collective Communications Library) provides optimized collective primitives for multi-GPU/multi-node training"
      - "NCCL selects algorithms based on message size, topology (NVLink/PCIe/IB), number of GPUs, and hardware capabilities"
      - "For small messages it may use tree-based algorithms, for large messages ring or other bandwidth-optimal algorithms"
      - "NCCL builds topology graphs and uses heuristics/tuning to minimize latency and maximize bandwidth"
  - id: "dls-dd-010"
