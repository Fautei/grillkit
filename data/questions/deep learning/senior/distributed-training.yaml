    expected_points:
      - "Pipeline parallelism splits model layers across devices, processing micro-batches through pipeline stages"
      - "GPipe splits each batch into M micro-batches and uses synchronous pipeline schedule, processing forward then backward"
      - "Pipeline bubble is idle time when some stages wait for inputs/outputs, proportional to (number of stages - 1)/M"
      - "GPipe enables training larger models by sharding layers and uses recomputation for memory efficiency"
  - id: "dls-dd-013"
    type: "knowledge"
    difficulty: 5
    tags: ["pipeline-parallel", "1f1b", "memory"]
    question:
      text:
        en: "How does 1F1B (pipeline schedule) reduce memory vs GPipe?"
        ru: "Как расписание 1F1B (one-forward-one-backward) экономит память по сравнению с GPipe?"
      code: null
    follow_ups:
      en:
        - "What is the trade-off of 1F1B schedule?"
      ru:
        - "В чем компромисс расписания 1F1B?"
    expected_points:
      - "1F1B interleaves forward and backward passes: after warmup, each stage does one forward then one backward per micro-batch cycle"
      - "Unlike GPipe which stores activations for all micro-batches, 1F1B only needs activations for micro-batches currently in pipeline"
      - "This reduces peak activation memory from O(M) to O(number of stages) in terms of in-flight micro-batches"
      - "1F1B maintains similar bubble size but significantly lower memory footprint enabling larger models"
