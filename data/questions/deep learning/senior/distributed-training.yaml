      ru:
        - "Почему пропускная способность сети критична для data parallel обучения?"
    expected_points:
      - "NVLink provides highest bandwidth for intra-node GPU-GPU communication with low latency"
      - "PCIe is slower than NVLink and creates bottlenecks for heavy intra-node communication"
      - "InfiniBand offers high bandwidth and low latency for inter-node communication, critical for scaling beyond single node"
      - "RoCE provides RDMA over Ethernet but typically has higher latency/jitter than InfiniBand affecting large-scale training efficiency"
