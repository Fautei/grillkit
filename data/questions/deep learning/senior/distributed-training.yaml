        en: "How does multi-node topology (NVLink, PCIe, InfiniBand, RoCE) affect training speed?"
        ru: "Как топология мульти-нодовой системы (NVLink, PCIe, InfiniBand, RoCE) влияет на скорость обучения?"
      code: null
    follow_ups:
