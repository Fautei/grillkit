    expected_points:
      - "Gradient compression reduces communication by transmitting only most significant gradient values (top-k) or low-rank approximations (powerSGD)"
      - "Trade-off is reduced communication cost vs loss of gradient information and potential convergence degradation"
      - "Error compensation/memory mechanisms are often needed to accumulate dropped gradient components"
      - "Compression is most effective in bandwidth-limited settings but may require tuning of compression ratio"
  - id: "dls-dd-009"
