      - "Represent each document as a bag-of-words vector (counts or TF-IDF)"
      - "Feed the vector into a small neural network (dense layers)"
      - "Train with cross-entropy loss for classification"
      - "Evaluate with accuracy, precision, recall, or F1"
      - "Word order is ignored, limiting performance on complex tasks"

