      - "Each token is classified with a tag such as B-PER or I-PER"
      - "BIO scheme marks the beginning and inside of an entity span"
      - "Models are usually token classifiers built on contextual embeddings"
      - "Evaluation uses entity-level precision, recall, and F1"

