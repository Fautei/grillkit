      - "Use an encoder-decoder architecture (often with attention)"
      - "The decoder generates the target sentence token by token"
      - "Train with teacher forcing and cross-entropy loss"
      - "Decode at inference with beam search or greedy decoding"
      - "Evaluate with metrics such as BLEU"

