category: "NLP Fundamentals"
track: "deep learning"
level: "junior"

description: "Practical NLP basics: text preprocessing, embeddings, and classic text tasks for junior engineers"

questions:
  - id: "dlj-nlp-001"
    type: "knowledge"
    difficulty: 1
    tags: ["preprocessing", "tokenization", "normalization"]
    question:
      text:
        en: "What are the basic text preprocessing steps (lowercasing, tokenization, normalization)?"
        ru: "Каковы базовые шаги предобработки текста (приведение к нижнему регистру, токенизация, нормализация)?"
      code: null
    follow_ups:
      en:
        - "In what order should these steps be applied and why?"
      ru:
        - "В каком порядке следует применять эти шаги и почему?"
    expected_points:
      - "Lowercasing reduces vocabulary size and unifies word forms"
      - "Tokenization splits text into tokens such as words or subwords"
      - "Normalization handles punctuation, accents, or special characters"
      - "Cleaning may remove HTML, URLs, or excessive whitespace"
      - "The exact steps depend on the task and model requirements"

  - id: "dlj-nlp-002"
    type: "knowledge"
    difficulty: 1
    tags: ["stop words", "preprocessing"]
    question:
      text:
        en: "What are stop words and when should you remove them?"
        ru: "Что такое stop words и когда их следует удалять?"
      code: null
    follow_ups:
      en:
        - "Why might removing stop words hurt a neural model?"
      ru:
        - "Почему удаление stop words может навредить нейросетевой модели?"
    expected_points:
      - "Stop words are frequent words with little semantic content (the, is, at)"
      - "They are often removed in bag-of-words or TF-IDF pipelines"
      - "Removal reduces noise and vocabulary size for classical methods"
      - "Modern neural models usually keep them because context matters"
      - "Domain-specific stop lists may be needed for specialized tasks"

  - id: "dlj-nlp-003"
    type: "knowledge"
    difficulty: 1
    tags: ["one-hot", "encoding", "limitations"]
    question:
      text:
        en: "Explain one-hot encoding of words and its limitations."
        ru: "Объясните one-hot кодирование слов и его ограничения."
      code: null
    follow_ups:
      en:
        - "How does a learned embedding solve the sparsity problem of one-hot vectors?"
      ru:
        - "Как обучаемый embedding решает проблему разреженности one-hot векторов?"
    expected_points:
      - "Each word is represented as a vector with a single 1 and the rest 0"
      - "The vector dimension equals the vocabulary size"
      - "It creates very sparse, high-dimensional representations"
      - "It cannot capture semantic similarity between words"
      - "Vocabulary size grows large and out-of-vocabulary words are unsupported"

  - id: "dlj-nlp-004"
    type: "knowledge"
    difficulty: 1
    tags: ["tf-idf", "weighting", "text"]
    question:
      text:
        en: "What is TF-IDF and how does it weight words in a document?"
        ru: "Что такое TF-IDF и как он взвешивает слова в документе?"
      code: null
    follow_ups:
      en:
        - "What does the IDF component do and why is it useful?"
      ru:
        - "Что делает компонент IDF и зачем он нужен?"
    expected_points:
      - "TF-IDF combines term frequency (TF) with inverse document frequency (IDF)"
      - "TF counts how often a word appears in a document"
      - "IDF downweights words that appear in many documents"
      - "The product highlights words important to a specific document"
      - "It produces sparse vectors and is common in classical text retrieval"

  - id: "dlj-nlp-005"
    type: "knowledge"
    difficulty: 1
    tags: ["embeddings", "dense vectors", "representation"]
    question:
      text:
        en: "What are word embeddings at a basic level and why are they dense vectors?"
        ru: "Что такое word embeddings на базовом уровне и почему они плотные векторы?"
      code: null
    follow_ups:
      en:
        - "What does it mean that similar words are close in embedding space?"
      ru:
        - "Что означает, что похожие слова близки в пространстве embedding?"
    expected_points:
      - "Word embeddings map words to low-dimensional real-valued vectors"
      - "They are learned from data so semantically similar words are close"
      - "Dense vectors capture distributed meaning rather than a single index"
      - "They are much smaller than one-hot vectors for large vocabularies"
      - "They can be used as input features for downstream models"

  - id: "dlj-nlp-006"
    type: "knowledge"
    difficulty: 2
    tags: ["static embeddings", "contextual embeddings", "bert"]
    question:
      text:
        en: "What is the difference between static and contextual word embeddings?"
        ru: "В чём разница между статическими и контекстуальными word embeddings?"
      code: null
    follow_ups:
      en:
        - "Give an example where a static embedding fails but a contextual one succeeds."
      ru:
        - "Приведите пример, где статический embedding не работает, а контекстуальный справляется."
    expected_points:
      - "Static embeddings assign one vector per word regardless of context"
      - "Contextual embeddings produce different vectors depending on surrounding words"
      - "Static examples include Word2Vec and GloVe"
      - "Contextual examples include ELMo and transformer models like BERT"
      - "Contextual embeddings better handle polysemy (words with multiple meanings)"

  - id: "dlj-nlp-007"
