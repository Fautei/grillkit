  - id: "dlj-nlp-019"
    type: "knowledge"
    difficulty: 1
    tags: ["class imbalance", "text classification", "metrics"]
    question:
      text:
        en: "What is text classification with imbalanced classes and how do you handle it?"
        ru: "Что такое классификация текста с несбалансированными классами и как с этим справляться?"
      code: null
    follow_ups:
      en:
        - "Which resampling methods are common for imbalanced text data?"
      ru:
        - "Какие методы ресэмплинга типичны для несбалансированных текстовых данных?"
    expected_points:
      - "Imbalanced classes mean one class dominates the dataset"
      - "Accuracy can be misleading when classes are skewed"
      - "Use weighted loss or class weights during training"
      - "Resample data (oversample minority or undersample majority)"
      - "Evaluate with precision, recall, F1, or PR-AUC instead of accuracy"

  - id: "dlj-nlp-020"
    type: "scenario"
    difficulty: 2
    tags: ["imbalance", "metrics", "diagnosis"]
    question:
      text:
        en: "Your text classifier gets 99% accuracy on a dataset that is 99/1 by class. What is wrong and what metric should you use instead?"
        ru: "Ваш текстовый классификатор достигает 99% accuracy на датасете с соотношением классов 99/1. Что не так и какую метрику следует использовать вместо этого?"
      code: null
    follow_ups:
      en:
        - "How could you verify the model actually learned something useful?"
      ru:
        - "Как можно проверить, что модель действительно чему-то научилась?"
    expected_points:
      - "A trivial classifier predicting the majority class already reaches 99% accuracy"
      - "Accuracy hides poor performance on the minority class"
      - "Use F1, precision, recall, or PR-AUC to assess minority-class performance"
      - "Inspect the confusion matrix for false negatives and false positives"
      - "Consider balanced accuracy or MCC for imbalanced settings"

