questions:
  - id: "dlj-fw-001"
    type: "knowledge"
    difficulty: 2
    tags: ["pytorch", "keras", "comparison"]
    question:
      text:
        en: "Compare PyTorch and TensorFlow/Keras: eager vs graph execution, and typical strengths of each."
        ru: "Сравните PyTorch и TensorFlow/Keras: eager против графовое выполнение, сильные стороны каждого."
      code: null
    follow_ups:
      en:
        - "Why is PyTorch popular in research and Keras in prototyping?"
      ru:
        - "Почему PyTorch популярен в исследованиях, а Keras — в прототипировании?"
    expected_points:
      - "PyTorch: eager execution, Pythonic, dynamic graphs, debug-friendly"
      - "TF/Keras: static graph heritage, TFLite/TFX production ecosystem"
      - "PyTorch: research standard, flexible control flow"
      - "TF: strong mobile/edge (TFLite) and Vertex AI integration"
      - "Both now support tracing/compilation (torch.compile, TF2)"

