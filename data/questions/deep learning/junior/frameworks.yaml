    follow_ups:
      en:
        - "What is the role of super().__init__() and self.parameters()?"
      ru:
        - "Какова роль super().__init__() и self.parameters()?"
    expected_points:
      - "Subclass nn.Module, define layers in __init__"
      - "Implement forward(self, x) defining the computation"
      - "nn.Module tracks parameters automatically (state_dict)"
      - "Can nest modules (containers like Sequential)"
      - "forward defines behavior; model is a callable object"

