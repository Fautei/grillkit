      - "FP: false alarm; TN: correctly predicted negative"
      - "Fraud: FN (missed fraud) usually costs more than FP (false alarm)"
      - "Tune threshold to balance cost of the two errors"
      - "Derived: precision = TP/(TP+FP), recall = TP/(TP+FN)"

