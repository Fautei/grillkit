    tags: ["skip", "residual", "connections"]
    question:
      text:
        en: "Why do residual (skip) connections make deep networks trainable?"
        ru: "Почему резидуальные (skip) соединения делают глубокие сети обучаемыми?"
      code: null
    follow_ups:
