    tags: ["confusion-matrix", "classification"]
    question:
      text:
        en: "Explain the confusion matrix: TP, FP, FN, TN. How do you read it for a fraud detector?"
        ru: "Объясните матрицу ошибок: TP, FP, FN, TN. Как её читать для детектора мошенничества?"
