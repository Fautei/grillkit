        - "What does a gap between train and validation loss tell you?"
      ru:
        - "О чём говорит разрыв между train и validation потерей?"
    expected_points:
      - "Train loss decreases while validation loss plateaus/rises"
      - "Model has memorized training data, not learned patterns"
      - "Fixes: more data, data augmentation, dropout, weight decay"
      - "Early stopping at the best validation checkpoint"
      - "Reduce model capacity (width/depth)"
      - "Check data leakage between train and validation sets"

  - id: "dlj-nn-013"
    type: "knowledge"
    difficulty: 2
    tags: ["underfitting", "bias", "variance"]
    question:
      text:
        en: "What is underfitting and how does it differ from overfitting? How to fix it?"
        ru: "Что такое недообучение и чем оно отличается от переобучения? Как его исправить?"
      code: null
    follow_ups:
      en:
        - "How do bias and variance relate to over/underfitting?"
      ru:
        - "Как смещение и дисперсия связаны с пере-/недообучением?"
    expected_points:
      - "Underfitting: both train and validation loss are high"
      - "Model too simple to capture the pattern"
      - "High bias, low variance regime"
      - "Fixes: more capacity, more training, better features/init, smaller regularization"
      - "Opposite problem of overfitting (high variance)"

  - id: "dlj-nn-014"
