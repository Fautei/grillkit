        - "Why do large batch sizes sometimes generalize worse?"
      ru:
        - "Почему большие батчи иногда хуже генерализуют?"
    expected_points:
      - "Epoch: one full pass over the training set"
      - "Batch size: number of samples per gradient step"
      - "Small batches: noisier gradients, implicit regularization, less memory"
      - "Large batches: stable gradients, faster wall-clock on GPU, need higher LR"
      - "Batch size also affects generalization (flat vs sharp minima)"

  - id: "dlj-nn-017"
