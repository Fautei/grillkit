category: "Neural Network Basics"
track: "deep learning"
level: "junior"

description: "Perceptrons, MLPs, activation functions, loss functions, and how networks learn"

questions:
  - id: "dlj-nn-001"
    type: "knowledge"
    difficulty: 2
    tags: ["mlp", "perceptron", "architecture"]
    question:
      text:
        en: "What is a multilayer perceptron (MLP) and how does the forward pass work?"
        ru: "Что такое многослойный перцептрон (MLP) и как работает прямой проход?"
      code: null
    follow_ups:
      en:
        - "How many parameters does a 784-256-10 network have?"
      ru:
        - "Сколько параметров у сети 784-256-10?"
    expected_points:
      - "MLP: fully connected input, hidden, and output layers"
      - "Forward pass: x -> W*x + b -> activation, repeated per layer"
      - "Each neuron computes a linear function then applies a nonlinearity"
      - "Output layer shape depends on task (1 for regression, C for classification)"

  - id: "dlj-nn-002"
    type: "knowledge"
    difficulty: 2
    tags: ["activation", "relu", "nonlinearity"]
    question:
      text:
        en: "Why do neural networks need non-linear activation functions?"
        ru: "Почему нейронным сетям нужны нелинейные функции активации?"
      code: null
    follow_ups:
      en:
        - "What does a network without activations become?"
      ru:
        - "Во что превращается сеть без активаций?"
    expected_points:
      - "Without nonlinearity, stacked layers collapse into one linear map"
      - "Nonlinearity lets networks approximate arbitrary functions"
      - "Activation introduces capacity to model complex decision boundaries"
      - "Each layer becomes W*act(W*act(...x)) instead of Wx+b"

  - id: "dlj-nn-003"
    type: "knowledge"
    difficulty: 2
    tags: ["activation", "sigmoid", "tanh"]
    question:
      text:
        en: "Compare sigmoid, tanh, and ReLU activation functions. When is each appropriate?"
        ru: "Сравните функции активации sigmoid, tanh и ReLU. Когда каждая уместна?"
      code: null
    follow_ups:
      en:
        - "What is the vanishing gradient problem for sigmoid?"
      ru:
        - "Что такое проблема затухающих градиентов у sigmoid?"
    expected_points:
      - "Sigmoid: (0,1), squashes output, saturates, good for binary output"
      - "Tanh: (-1,1), zero-centered, also saturates"
      - "ReLU: max(0,x), no positive saturation, computationally cheap"
      - "Sigmoid/tanh derivatives are small for large inputs (vanishing gradients)"
      - "ReLU can die (permanently zero output) with large learning rates"

  - id: "dlj-nn-004"
    type: "knowledge"
    difficulty: 2
    tags: ["activation", "elu", "gelu", "swish"]
    question:
      text:
        en: "What are ReLU variants (Leaky ReLU, ELU, GELU, Swish) and what problems do they solve?"
        ru: "Какие варианты ReLU (Leaky ReLU, ELU, GELU, Swish) существуют и какие проблемы они решают?"
      code: null
    follow_ups:
      en:
        - "Why is GELU popular in transformers?"
      ru:
        - "Почему GELU популярен в трансформерах?"
    expected_points:
      - "Leaky ReLU: small negative slope avoids dying ReLU"
      - "ELU: smooth, negative outputs, shifts mean toward zero"
      - "GELU: x*Phi(x), smooth nonlinearity used in BERT/GPT"
      - "Swish/SiLU: x*sigmoid(x), smooth, used in mobile and modern nets"
      - "All aim to keep gradients flowing in negative region"

  - id: "dlj-nn-005"
    type: "knowledge"
    difficulty: 2
    tags: ["loss", "cross-entropy", "classification"]
    question:
      text:
        en: "Why is cross-entropy the standard loss for classification? What does it measure?"
        ru: "Почему кросс-энтропия — стандартная функция потерь для классификации? Что она измеряет?"
      code: null
    follow_ups:
      en:
        - "How does cross-entropy behave when the model is confident and wrong?"
      ru:
        - "Как ведёт себя кросс-энтропия, когда модель уверенно ошибается?"
    expected_points:
      - "Measures difference between predicted and true distributions"
      - "Derived from maximum likelihood / negative log-likelihood"
      - "Penalizes confident wrong predictions heavily (log divergence)"
      - "Combined with softmax it is differentiable and well-behaved"
      - "Zero loss only when predicted distribution matches truth"

  - id: "dlj-nn-006"
    type: "knowledge"
    difficulty: 2
    tags: ["loss", "mse", "regression"]
    question:
      text:
        en: "What is the difference between MSE and MAE for regression, and when do you pick each?"
        ru: "Чем MSE отличается от MAE в регрессии и когда выбирают каждую?"
      code: null
    follow_ups:
      en:
        - "Why is MSE sensitive to outliers?"
      ru:
        - "Почему MSE чувствителен к выбросам?"
    expected_points:
      - "MSE: squared error, penalizes large errors quadratically"
      - "MAE: absolute error, robust to outliers"
      - "MSE corresponds to Gaussian noise likelihood"
      - "MAE corresponds to Laplace noise likelihood"
      - "MSE gradient is zero at zero error; MAE gradient undefined at zero"

  - id: "dlj-nn-007"
    type: "knowledge"
    difficulty: 2
    tags: ["softmax", "classification", "output"]
    question:
      text:
        en: "What does the softmax function do and why is it used in classification output layers?"
        ru: "Что делает функция softmax и зачем она нужна в выходном слое классификации?"
      code: null
    follow_ups:
      en:
        - "How do you avoid numerical instability in softmax?"
      ru:
        - "Как избежать численной нестабильности в softmax?"
    expected_points:
      - "Converts logits into a probability distribution (sums to 1)"
      - "Exponentiates then normalizes: e^x_i / sum(e^x_j)"
      - "Softens argmax, allows differentiable comparisons"
      - "Subtract max logit for stability (log-sum-exp trick)"
      - "With cross-entropy it simplifies to log-softmax loss"

  - id: "dlj-nn-008"
    type: "knowledge"
    difficulty: 3
    tags: ["bias", "weights", "parameters"]
    question:
      text:
        en: "What are weights and biases in a neuron? What would happen without the bias term?"
        ru: "Что такое веса и bias в нейроне? Что случится без bias?"
      code: null
    follow_ups:
      en:
        - "Can normalization layers replace biases?"
      ru:
        - "Могут ли нормализующие слои заменить bias?"
    expected_points:
      - "Weights scale inputs, bias shifts the activation threshold"
      - "Without bias, activation is forced through origin"
      - "Bias allows decision boundaries to move"
      - "BatchNorm can absorb biases; some architectures omit them"
      - "Bias adds one parameter per neuron"

  - id: "dlj-nn-009"
    type: "knowledge"
    difficulty: 3
    tags: ["initialization", "xavier", "he"]
    question:
      text:
        en: "Why does weight initialization matter? Explain Xavier and He initialization."
        ru: "Почему важна инициализация весов? Объясните Xavier и He инициализацию."
      code: null
    follow_ups:
      en:
        - "What happens if all weights start at zero?"
      ru:
        - "Что произойдёт, если все веса начать с нуля?"
    expected_points:
      - "Bad init causes vanishing or exploding activations/gradients"
      - "Zero init: all neurons identical, symmetry never breaks"
      - "Xavier/Glorot: variance tuned for tanh/sigmoid (fan_in+fan_out)"
      - "He init: larger variance for ReLU (2/fan_in)"
      - "Good init keeps signal variance stable through layers"

  - id: "dlj-nn-010"
    type: "knowledge"
    difficulty: 3
    tags: ["universal", "approximation", "capacity"]
    question:
      text:
        en: "What does the universal approximation theorem say and what are its practical limits?"
        ru: "Что утверждает теорема универсального аппроксимирования и каковы её практические ограничения?"
      code: null
    follow_ups:
      en:
        - "Does a wider network always generalize better?"
      ru:
        - "Всегда ли более широкая сеть лучше генерализует?"
    expected_points:
      - "A single hidden layer with enough units can approximate any continuous function"
      - "Theorem is existential: it says nothing about how many units or how to learn them"
      - "Deep networks need far fewer parameters than wide ones in practice"
      - "Capacity alone does not guarantee good generalization"

  - id: "dlj-nn-011"
    type: "knowledge"
    difficulty: 2
    tags: ["depth", "width", "architecture"]
    question:
      text:
        en: "What is the trade-off between depth and width of a network?"
        ru: "В чём компромисс между глубиной и шириной сети?"
      code: null
