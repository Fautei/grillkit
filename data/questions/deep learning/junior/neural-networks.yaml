      text:
        en: "What is Batch Normalization and why does it speed up training?"
        ru: "Что такое Batch Normalization и почему он ускоряет обучение?"
      code: null
    follow_ups:
      en:
        - "How does BatchNorm behave at inference time?"
      ru:
        - "Как работает BatchNorm на этапе инференса?"
    expected_points:
      - "Normalizes each feature across the mini-batch"
      - "Reduces internal covariate shift, stabilizes distributions"
      - "Allows higher learning rates, acts as mild regularizer"
      - "Inference uses running mean/variance, not batch stats"
      - "Has learnable scale (gamma) and shift (beta) parameters"

  - id: "dlj-nn-022"
