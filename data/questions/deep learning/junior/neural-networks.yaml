        - "When does making a network deeper help and when hurt?"
      ru:
        - "Когда увеличение глубины помогает, а когда вредит?"
    expected_points:
      - "Depth composes transformations, learns hierarchical features"
      - "Width increases capacity per layer"
      - "Deep nets train better with residuals/skips and normalization"
      - "Wider nets are easier to train (capacity, ensemble effect)"
      - "Cost: more memory and compute; diminishing returns"

  - id: "dlj-nn-012"
    type: "knowledge"
    difficulty: 2
    tags: ["overfitting", "regularization", "generalization"]
    question:
      text:
        en: "How do you detect overfitting during training and what are the first fixes to try?"
        ru: "Как обнаружить переобучение во время обучения и что делать в первую очередь?"
      code: null
    follow_ups:
