      - "L2: add lambda*||w||^2 to loss; equivalent in vanilla SGD"
      - "With adaptive optimizers the two are NOT equivalent"
      - "AdamW decouples decay from gradient-based update"
      - "Prevents large weights, mild generalization benefit"

  - id: "dlj-nn-025"
