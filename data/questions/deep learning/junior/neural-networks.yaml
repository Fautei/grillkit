        - "What is the gradient path through a ResNet block?"
      ru:
        - "Какой путь градиента через блок ResNet?"
    expected_points:
      - "Identity shortcut gives gradient a direct path to early layers"
      - "Network learns F(x) = H(x) - x instead of H(x)"
      - "Identity mapping is trivially optimal (zero F), easy start"
      - "Prevents degradation in very deep networks"
      - "Foundation of ResNet and most modern deep architectures"

  - id: "dlj-nn-021"
