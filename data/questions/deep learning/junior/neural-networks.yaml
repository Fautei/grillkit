      code: null
    follow_ups:
      en:
        - "What is the learning rate range test?"
      ru:
        - "Что такое learning rate range test?"
    expected_points:
      - "Start with optimizer default (e.g., 1e-3 for Adam, 1e-2 for SGD+momentum)"
      - "Learning rate range test: sweep LR, pick lowest loss before divergence"
      - "Watch training loss: spikes mean LR too high, flat line too low"
      - "Use schedules: warmup + cosine/step decay"
      - "Sensitivity: small changes often have large effects"

  - id: "dlj-nn-018"
    type: "knowledge"
    difficulty: 2
    tags: ["vanishing", "gradients", "depth"]
    question:
      text:
        en: "What is the vanishing gradient problem and which components cause it?"
        ru: "Что такое проблема затухающих градиентов и какие компоненты её вызывают?"
      code: null
    follow_ups:
      en:
        - "How do skip connections solve vanishing gradients?"
      ru:
        - "Как skip connections решают проблему затухающих градиентов?"
    expected_points:
      - "Gradients shrink exponentially through many layers"
      - "Causes: saturating activations, weight norms < 1, long chains"
      - "Early layers receive almost no update signal"
      - "Solutions: ReLU, skip connections, BatchNorm, careful init"
      - "Opposite problem: exploding gradients"

  - id: "dlj-nn-019"
    type: "knowledge"
    difficulty: 2
    tags: ["exploding", "gradients", "clipping"]
    question:
      text:
        en: "What are exploding gradients and how do you prevent them?"
        ru: "Что такое взрывающиеся градиенты и как их предотвратить?"
      code: null
    follow_ups:
      en:
        - "How does gradient clipping work and what is a safe norm?"
      ru:
        - "Как работает клипирование градиентов и какая норма безопасна?"
    expected_points:
      - "Gradients grow explosively, causing NaNs or divergence"
      - "Caused by large weights, recurrent connections, unstable init"
      - "Fix: clip gradients by global norm (e.g., 1.0)"
      - "Weight decay, normalization, and good init also help"
      - "Common in RNNs and deep networks with high LR"

  - id: "dlj-nn-020"
    type: "knowledge"
