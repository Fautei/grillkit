      ru:
        - "Что будет, если learning rate слишком большой или слишком маленький?"
    expected_points:
      - "Update rule: w = w - lr * gradient"
      - "Learning rate scales the step size toward lower loss"
      - "Too large: divergence or oscillation; too small: slow, stuck in noise"
      - "Minimizes the empirical loss, not the true risk"
      - "Stochastic variants use mini-batches for efficiency"

  - id: "dlj-nn-016"
