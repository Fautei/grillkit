      ru:
        - "Почему BatchNorm проблематичен для последовательностей переменной длины?"
    expected_points:
      - "LayerNorm normalizes across features per sample, not across batch"
      - "BatchNorm needs batch statistics — unstable with small batches or sequences"
      - "RMSNorm: no mean subtraction, cheaper, used in LLaMA"
      - "Position-wise normalization suits attention layers"
      - "No running statistics needed at inference"

  - id: "dlj-nn-023"
