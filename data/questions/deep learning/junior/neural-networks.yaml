    tags: ["normalization", "layernorm", "rmsnorm"]
    question:
      text:
        en: "How do LayerNorm and RMSNorm differ from BatchNorm, and why are they used in transformers?"
        ru: "Чем LayerNorm и RMSNorm отличаются от BatchNorm и почему они используются в трансформерах?"
      code: null
    follow_ups:
