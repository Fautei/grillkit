    tags: ["backprop", "chain-rule", "gradients"]
    question:
      text:
        en: "Walk through how backpropagation computes gradients layer by layer."
        ru: "Пошагово объясните, как бэкпропагация вычисляет градиенты по слоям."
      code: null
    follow_ups:
      en:
        - "Why do we need the chain rule at each layer?"
      ru:
        - "Зачем нужно правило цепочки на каждом слое?"
    expected_points:
      - "Forward pass stores activations for backward reuse"
      - "Loss gradient computed first, then propagated backwards"
      - "Each layer: dL/dW = dL/dout * dout/dW via chain rule"
      - "Gradients accumulate contributions from all downstream paths"
      - "Autograd frameworks build the computation graph and reverse it"

  - id: "dlj-nn-015"
    type: "knowledge"
    difficulty: 3
    tags: ["gradient-descent", "optimizer", "learning-rate"]
    question:
      text:
