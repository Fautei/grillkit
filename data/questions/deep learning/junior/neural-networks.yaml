      - "Inference: no dropout, use full network"
      - "Prevents co-adaptation of features, implicit ensemble effect"
      - "Typical rates: 0.2-0.5 for dense layers"
      - "Applied after activation or to attention in transformers"

  - id: "dlj-nn-024"
