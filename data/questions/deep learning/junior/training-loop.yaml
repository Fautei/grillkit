questions:
  - id: "dlj-tr-001"
    type: "knowledge"
    difficulty: 2
    tags: ["training-loop", "epoch", "iteration"]
    question:
      text:
        en: "Describe a standard training loop: what happens in each epoch and each iteration?"
        ru: "Опишите стандартный цикл обучения: что происходит в каждой эпохе и итерации?"
      code: null
    follow_ups:
      en:
        - "Why do we reset the optimizer state or shuffle each epoch?"
      ru:
        - "Почему каждый epoch сбрасываем state оптимизатора или перемешиваем данные?"
    expected_points:
      - "Epoch: full pass over dataset; iteration: one batch"
      - "Per batch: forward, loss, backward, optimizer.step, zero_grad"
      - "Shuffle batches each epoch for unbiased gradient estimates"
      - "Track running loss; evaluate on validation set per epoch"
      - "Stop on early stopping or fixed number of epochs"

