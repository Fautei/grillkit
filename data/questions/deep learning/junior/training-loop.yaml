    expected_points:
      - "PyTorch accumulates gradients by default (for multi-batch tricks)"
      - "Without zeroing, old gradients add to new ones"
      - "Updates become huge and unstable, loss explodes"
      - "Standard practice: zero_grad after optimizer.step"
      - "Some frameworks (TF eager) do not accumulate"

